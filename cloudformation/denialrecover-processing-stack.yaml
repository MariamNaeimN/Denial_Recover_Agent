          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-PriorityQueueTableArn'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-KMSKey'

  PriorityQueueFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-priority-queue'
      Description: Parses analysis and adds claims to priority queue
      Runtime: python3.11
      Handler: index.handler
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt PriorityQueueLambdaRole.Arn
      Environment:
        Variables:
          PRIORITY_TABLE:
            Fn::ImportValue: !Sub '${DataStackName}-PriorityQueueTable'
          LOG_LEVEL: !If [IsProd, 'INFO', 'DEBUG']
      Code:
        ZipFile: |
          import os
          import json
          import logging
          import boto3
          from decimal import Decimal

          logger = logging.getLogger()
          logger.setLevel(os.environ.get('LOG_LEVEL', 'INFO'))

          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['PRIORITY_TABLE'])

          def handler(event, context):
              logger.info(f"Received event: {json.dumps(event)}")
              
              claim_id = event.get('claimId', 'unknown')
              patient_id = event.get('patientId', 'unknown')
              analysis_str = event.get('analysis', '{}')
              source_document = event.get('sourceDocument', '')
              
              # Parse analysis JSON - strip markdown code fences if present
              try:
                  if isinstance(analysis_str, str):
                      # Strip markdown code fences (```json ... ```)
                      clean = analysis_str.strip()
                      if clean.startswith('```'):
                          lines = clean.split('\n')
                          # Remove first line (```json or ```) and last line (```)
                          clean = '\n'.join(lines[1:-1] if lines[-1].strip() == '```' else lines[1:])
                      analysis = json.loads(clean)
                  else:
                      analysis = analysis_str
              except json.JSONDecodeError:
                  logger.warning(f"Could not parse analysis JSON: {analysis_str[:200]}")
                  analysis = {}
              
              # Extract priority data
              priority_score = analysis.get('priorityScore', 5)
              expected_recovery = analysis.get('expectedRecovery', 0)
              dollar_impact = analysis.get('dollarImpact', 0)
              success_probability = analysis.get('successProbability', 50)
              recovery_opportunity = analysis.get('recoveryOpportunity', 'MEDIUM')
              denial_reason = analysis.get('denialReason', 'UNKNOWN')
              
              # Calculate expected value for sorting (higher = more priority)
              # Use expected recovery * 100 to get integer for sort key
              expected_value = int(expected_recovery * 100) if expected_recovery else int(dollar_impact * success_probability)
              
              # Ensure minimum value of 1 for sort key
              expected_value = max(1, expected_value)
              
              # Make sort key unique by adding hash of claimId to avoid collisions
              # Two claims with same expectedValue would overwrite each other without this
              import hashlib
              claim_hash = int(hashlib.md5(claim_id.encode()).hexdigest()[:4], 16)
              unique_expected_value = expected_value * 100000 + claim_hash
              
              # Add to priority queue
              item = {
                  'queueId': 'ACTIVE',
                  'expectedValue': Decimal(str(unique_expected_value)),
                  'claimId': claim_id,
                  'patientId': patient_id,
                  'appealId': f'APL-{claim_id}',
                  'status': 'PENDING_REVIEW',
                  'priorityScore': Decimal(str(priority_score)),
                  'expectedRecovery': Decimal(str(expected_recovery)),
                  'dollarImpact': Decimal(str(dollar_impact)),
                  'successProbability': Decimal(str(success_probability)),
                  'recoveryOpportunity': recovery_opportunity,
                  'denialReason': denial_reason,
                  'sourceDocument': source_document,
                  'createdAt': event.get('timestamp', ''),
                  'updatedAt': event.get('timestamp', '')
              }
              
              table.put_item(Item=item)
              
              logger.info(f"Added claim {claim_id} to priority queue with expected value {expected_value}")
              
              return {
                  'statusCode': 200,
                  'claimId': claim_id,
                  'expectedValue': expected_value,
                  'priorityScore': priority_score,
                  'message': 'Added to priority queue'
              }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

