  # ---------------------------------------------------------------------------
  # IAM Role for Lambda (S3 Trigger)
  # ---------------------------------------------------------------------------
  TriggerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-trigger-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TriggerLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  - !Ref FullPipelineStateMachine
                  - !Ref DenialProcessingStateMachine
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 
                    - '${BucketArn}/*'
                    - BucketArn:
                        Fn::ImportValue: !Sub '${DataStackName}-DataBucketArn'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-KMSKey'

  # ---------------------------------------------------------------------------
  # Lambda Function - S3 Trigger (starts Step Functions)
  # ---------------------------------------------------------------------------
  S3TriggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-s3-trigger'
      Description: Triggers Step Functions when documents are uploaded to S3
      Runtime: python3.11
      Handler: index.handler
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt TriggerLambdaRole.Arn
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref FullPipelineStateMachine
          LOG_LEVEL: !If [IsProd, 'INFO', 'DEBUG']
      Code:
        ZipFile: |
          import os
          import json
          import logging
          import boto3
          import re
          from urllib.parse import unquote_plus

          logger = logging.getLogger()
          logger.setLevel(os.environ.get('LOG_LEVEL', 'INFO'))

          sfn = boto3.client('stepfunctions')
          STATE_MACHINE_ARN = os.environ['STATE_MACHINE_ARN']

          def get_document_type(key):
              """Determine document type from S3 key path"""
              if 'intake/claims/' in key:
                  return 'CLAIM'
              elif 'intake/eobs/' in key:
                  return 'EOB'
              elif 'intake/medical-records/' in key:
                  return 'MEDICAL_RECORD'
              elif 'intake/prior-auths/' in key:
                  return 'PRIOR_AUTH'
              else:
                  return 'UNKNOWN'

          def extract_patient_id(key):
              """Extract patient ID from S3 key path (e.g., PAT001 from intake/claims/PAT001_john_smith/...)"""
              match = re.search(r'(PAT\d+)', key)
              return match.group(1) if match else None

          def extract_claim_id(key):
              """Extract claim ID from filename (e.g., CLM001 from denied_claim_CLM001.pdf or eob_CLM001.pdf)"""
              # Match patterns like CLM001, CLM02101, CLM02102, etc.
              match = re.search(r'(CLM\d+)', key)
              return match.group(1) if match else None

          def handler(event, context):
              logger.info(f"Received event: {json.dumps(event)}")
              
              executions = []
              skipped = []
              
              for record in event.get('Records', []):
                  bucket = record['s3']['bucket']['name']
                  key = unquote_plus(record['s3']['object']['key'])
                  
                  # Only process PDF/image documents
                  if not any(key.lower().endswith(ext) for ext in ['.pdf', '.png', '.jpg', '.jpeg', '.tiff']):
                      logger.info(f"Skipping non-document: {key}")
                      skipped.append(key)
                      continue
                  
                  # Determine document type from path
                  document_type = get_document_type(key)
                  patient_id = extract_patient_id(key)
                  claim_id = extract_claim_id(key)
                  
                  if document_type == 'UNKNOWN':
                      logger.info(f"Skipping unknown document type: {key}")
                      skipped.append(key)
                      continue
                  
                  # Only trigger pipeline for CLAIM documents (not EOBs/medical records/prior auths)
                  # EOBs, medical records, and prior auths are picked up by ListRelatedFiles when the claim is processed
                  if document_type != 'CLAIM':
                      logger.info(f"Skipping non-claim document (will be picked up by ListRelatedFiles): {key}")
                      skipped.append(key)
                      continue
                  
                  if not claim_id:
                      logger.warning(f"Could not extract claim ID from: {key}")
                      skipped.append(key)
                      continue
                  
                  # Build input for Step Functions
                  input_data = {
                      'bucket': bucket,
                      'key': key,
                      'eventTime': record['eventTime'],
                      'documentType': document_type,
                      'patientId': patient_id,
                      'claimId': claim_id
                  }
                  
                  execution_name = f"{claim_id}-{document_type}-{context.aws_request_id[:8]}"
                  
                  response = sfn.start_execution(
                      stateMachineArn=STATE_MACHINE_ARN,
                      name=execution_name,
                      input=json.dumps(input_data)
                  )
                  
                  logger.info(f"Started execution for {document_type} (Claim: {claim_id}): {response['executionArn']}")
                  executions.append(response['executionArn'])
              
              return {'executions': executions, 'skipped': skipped}
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  S3TriggerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${S3TriggerFunction}'
      RetentionInDays: !If [IsProd, 365, 30]

  S3TriggerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref S3TriggerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn:
        Fn::ImportValue: !Sub '${DataStackName}-DataBucketArn'
      SourceAccount: !Ref AWS::AccountId


  # ---------------------------------------------------------------------------
  # Step Functions State Machine - WITH STATUS TRACKING AFTER EACH STEP
  # ---------------------------------------------------------------------------
  DenialProcessingStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ProjectName}-${Environment}-denial-processing'
      RoleArn: !GetAtt StepFunctionsRole.Arn
      Definition:
        Comment: DenialRecover AI - Document Processing Pipeline with Status Tracking
        StartAt: RouteByDocumentType
        States:
          # =========================================================================
          # STEP 0: ROUTE BY DOCUMENT TYPE
          # =========================================================================
          RouteByDocumentType:
            Type: Choice
            Choices:
              - Variable: $.documentType
                StringEquals: CLAIM
                Next: GenerateClaimId
              - Variable: $.documentType
                StringEquals: EOB
                Next: ProcessSupportingDocument
              - Variable: $.documentType
                StringEquals: MEDICAL_RECORD
                Next: ProcessSupportingDocument
              - Variable: $.documentType
                StringEquals: PRIOR_AUTH
                Next: ProcessSupportingDocument
            Default: GenerateClaimId

          # =========================================================================
          # SUPPORTING DOCUMENT PROCESSING (EOB, Medical Records, Prior Auth)
          # =========================================================================
          ProcessSupportingDocument:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:textract:startDocumentAnalysis
            Parameters:
              DocumentLocation:
                S3Object:
                  Bucket.$: $.bucket
                  Name.$: $.key
              FeatureTypes:
                - FORMS
                - TABLES
            ResultPath: $.textractJob
            Retry:
              - ErrorEquals:
                  - Textract.ProvisionedThroughputExceededException
                  - Textract.ThrottlingException
                  - States.TaskFailed
                IntervalSeconds: 10
                MaxAttempts: 6
                BackoffRate: 2
            Next: WaitForSupportingDocTextract

          WaitForSupportingDocTextract:
            Type: Wait
            Seconds: 10
            Next: CheckSupportingDocTextractStatus

          CheckSupportingDocTextractStatus:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:textract:getDocumentAnalysis
            Parameters:
              JobId.$: $.textractJob.JobId
              MaxResults: 1
            ResultPath: $.textractStatus
            Retry:
              - ErrorEquals:
                  - Textract.ProvisionedThroughputExceededException
                  - Textract.ThrottlingException
                  - States.TaskFailed
                IntervalSeconds: 5
                MaxAttempts: 5
                BackoffRate: 2
            Next: IsSupportingDocTextractComplete

          IsSupportingDocTextractComplete:
            Type: Choice
            Choices:
              - Variable: $.textractStatus.JobStatus
                StringEquals: SUCCEEDED
                Next: GetSupportingDocTextractResults
              - Variable: $.textractStatus.JobStatus
                StringEquals: FAILED
                Next: SupportingDocProcessingComplete
            Default: WaitForSupportingDocTextract

          GetSupportingDocTextractResults:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:textract:getDocumentAnalysis
            Parameters:
              JobId.$: $.textractJob.JobId
            ResultPath: $.textractResults
            Retry:
              - ErrorEquals:
                  - Textract.ProvisionedThroughputExceededException
                  - Textract.ThrottlingException
                  - States.TaskFailed
                IntervalSeconds: 5
                MaxAttempts: 5
                BackoffRate: 2
            Next: ExtractSupportingDocMedicalEntities

          ExtractSupportingDocMedicalEntities:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:comprehendmedical:detectEntitiesV2
            Parameters:
              Text.$: States.ArrayGetItem($.textractResults.Blocks[?(@.BlockType=='LINE')].Text, 0)
            ResultPath: $.medicalEntities
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.comprehendError
                Next: SupportingDocProcessingComplete
            Next: SupportingDocProcessingComplete

          SupportingDocProcessingComplete:
            Type: Succeed

          # =========================================================================
          # CLAIM DOCUMENT PROCESSING
          # =========================================================================
          GenerateClaimId:
            Type: Pass
            Parameters:
              bucket.$: $.bucket
              key.$: $.key
              eventTime.$: $.eventTime
              documentType.$: $.documentType
              patientId.$: $.patientId
              claimId.$: $.claimId
            Next: CreateClaimRecord

          # =========================================================================
          # STEP 1: CREATE CLAIM RECORD (Status: RECEIVED)
          # =========================================================================
          CreateClaimRecord:
            Type: Task
            Resource: arn:aws:states:::dynamodb:putItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
              Item:
                claimId:
                  S.$: $.claimId
                patientId:
                  S.$: $.patientId
                status:
                  S: RECEIVED
                processingStage:
                  S: CLAIM_CREATED
                sourceDocument:
                  M:
                    bucket:
                      S.$: $.bucket
                    key:
                      S.$: $.key
                createdAt:
                  S.$: $$.State.EnteredTime
                updatedAt:
                  S.$: $$.State.EnteredTime
                processingHistory:
                  L:
                    - M:
                        stage:
                          S: CLAIM_CREATED
                        timestamp:
                          S.$: $$.State.EnteredTime
                        status:
                          S: SUCCESS
            ResultPath: $.claimRecord
            Next: StartTextract

          # =========================================================================
          # STEP 2: START TEXTRACT (Status: TEXTRACT_STARTED)
          # =========================================================================
          StartTextract:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:textract:startDocumentAnalysis
            Parameters:
              DocumentLocation:
                S3Object:
                  Bucket.$: $.bucket
                  Name.$: $.key
              FeatureTypes:
                - FORMS
                - TABLES
            ResultPath: $.textractJob
            Retry:
              - ErrorEquals:
                  - Textract.ProvisionedThroughputExceededException
                  - Textract.ThrottlingException
                  - States.TaskFailed
                IntervalSeconds: 10
                MaxAttempts: 6
                BackoffRate: 2
            Next: UpdateStatusTextractStarted

          UpdateStatusTextractStarted:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
              Key:
                claimId:
                  S.$: $.claimId
              UpdateExpression: "SET #status = :status, processingStage = :stage, textractJobId = :jobId, updatedAt = :time"
              ExpressionAttributeNames:
                '#status': status
              ExpressionAttributeValues:
                ':status':
                  S: PROCESSING
                ':stage':
                  S: TEXTRACT_STARTED
                ':jobId':
                  S.$: $.textractJob.JobId
                ':time':
                  S.$: $$.State.EnteredTime
            ResultPath: $.updateResult
            Next: WaitForTextract

          WaitForTextract:
            Type: Wait
            Seconds: 10
            Next: CheckTextractStatus

          CheckTextractStatus:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:textract:getDocumentAnalysis
            Parameters:
              JobId.$: $.textractJob.JobId
              MaxResults: 1
            ResultPath: $.textractStatus
            Retry:
              - ErrorEquals:
                  - Textract.ProvisionedThroughputExceededException
                  - Textract.ThrottlingException
                  - States.TaskFailed
                IntervalSeconds: 5
                MaxAttempts: 5
                BackoffRate: 2
            Next: IsTextractComplete

          IsTextractComplete:
            Type: Choice
            Choices:
              - Variable: $.textractStatus.JobStatus
                StringEquals: SUCCEEDED
                Next: GetTextractResults
              - Variable: $.textractStatus.JobStatus
                StringEquals: FAILED
                Next: TextractFailed
            Default: WaitForTextract

          # =========================================================================
          # STEP 3: GET TEXTRACT RESULTS (Status: TEXTRACT_COMPLETED)
          # =========================================================================
          GetTextractResults:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:textract:getDocumentAnalysis
            Parameters:
              JobId.$: $.textractJob.JobId
            ResultPath: $.textractResults
            Retry:
              - ErrorEquals:
                  - Textract.ProvisionedThroughputExceededException
                  - Textract.ThrottlingException
                  - States.TaskFailed
                IntervalSeconds: 5
                MaxAttempts: 5
                BackoffRate: 2
            Next: UpdateStatusTextractCompleted

          UpdateStatusTextractCompleted:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
              Key:
                claimId:
                  S.$: $.claimId
              UpdateExpression: "SET processingStage = :stage, updatedAt = :time, textractBlockCount = :blocks"
              ExpressionAttributeValues:
                ':stage':
                  S: TEXTRACT_COMPLETED
                ':time':
                  S.$: $$.State.EnteredTime
                ':blocks':
                  N.$: States.Format('{}', States.ArrayLength($.textractResults.Blocks))
            ResultPath: $.updateResult
            Next: ExtractMedicalEntities

          TextractFailed:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
              Key:
                claimId:
                  S.$: $.claimId
              UpdateExpression: "SET #status = :status, processingStage = :stage, updatedAt = :time, errorMessage = :error"
              ExpressionAttributeNames:
                '#status': status
              ExpressionAttributeValues:
                ':status':
                  S: FAILED
                ':stage':
                  S: TEXTRACT_FAILED
                ':time':
                  S.$: $$.State.EnteredTime
                ':error':
                  S: Textract document analysis failed
            Next: ProcessingFailed

          # =========================================================================
          # STEP 4: EXTRACT MEDICAL ENTITIES (Status: ENTITIES_EXTRACTED)
          # =========================================================================
          ExtractMedicalEntities:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:comprehendmedical:detectEntitiesV2
            Parameters:
              Text.$: States.ArrayGetItem($.textractResults.Blocks[?(@.BlockType=='LINE')].Text, 0)
            ResultPath: $.medicalEntities
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.comprehendError
                Next: UpdateStatusEntitiesSkipped
            Next: UpdateStatusEntitiesExtracted

          UpdateStatusEntitiesExtracted:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
              Key:
                claimId:
                  S.$: $.claimId
              UpdateExpression: "SET processingStage = :stage, updatedAt = :time, entityCount = :count"
              ExpressionAttributeValues:
                ':stage':
                  S: ENTITIES_EXTRACTED
                ':time':
                  S.$: $$.State.EnteredTime
                ':count':
                  N.$: States.Format('{}', States.ArrayLength($.medicalEntities.Entities))
            ResultPath: $.updateResult
            Next: InvokeAgentAnalysis

          UpdateStatusEntitiesSkipped:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
              Key:
                claimId:
                  S.$: $.claimId
              UpdateExpression: "SET processingStage = :stage, updatedAt = :time, entityCount = :count"
              ExpressionAttributeValues:
                ':stage':
                  S: ENTITIES_SKIPPED
                ':time':
                  S.$: $$.State.EnteredTime
                ':count':
                  N: '0'
            ResultPath: $.updateResult
            Next: InvokeAgentAnalysis

          # =========================================================================
          # STEP 5: AGENT ANALYSIS (Status: ANALYSIS_COMPLETED)
          # =========================================================================
          InvokeAgentAnalysis:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt InvokeAgentFunction.Arn
              Payload:
                claimId.$: $.claimId
                patientId.$: $.patientId
                bucket.$: $.bucket
                sourceKey.$: $.key
                extractedText.$: States.JsonToString($.textractResults.Blocks)
                medicalEntities.$: $.medicalEntities
                action: analyze
            ResultPath: $.agentAnalysis
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.agentError
                Next: FallbackAnalysis
            Next: UpdateStatusAnalysisCompleted

          UpdateStatusAnalysisCompleted:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
              Key:
                claimId:
                  S.$: $.claimId
              UpdateExpression: "SET processingStage = :stage, updatedAt = :time, analysisMethod = :method"
              ExpressionAttributeValues:
                ':stage':
                  S: ANALYSIS_COMPLETED
                ':time':
                  S.$: $$.State.EnteredTime
                ':method':
                  S: BEDROCK_AGENT
            ResultPath: $.updateResult
            Next: ParseAgentAnalysis

          ParseAgentAnalysis:
            Type: Pass
            Parameters:
              claimId.$: $.claimId
              patientId.$: $.patientId
              bucket.$: $.bucket
              key.$: $.key
              claimRecord.$: $.claimRecord
              textractJob.$: $.textractJob
              textractResults.$: $.textractResults
              medicalEntities.$: $.medicalEntities
              analysis.$: $.agentAnalysis.Payload.agentResponse
              payer.$: $.agentAnalysis.Payload.claimDetails.payer
              patientName.$: $.agentAnalysis.Payload.claimDetails.patientName
            Next: InvokeAgentAppeal

          # Fallback to direct Bedrock if Agent fails
          FallbackAnalysis:
            Type: Task
            Resource: arn:aws:states:::bedrock:invokeModel
            Parameters:
              ModelId: us.anthropic.claude-sonnet-4-5-20250929-v1:0
              ContentType: application/json
              Body:
                anthropic_version: bedrock-2023-05-31
                max_tokens: 4096
                messages:
                  - role: user
                    content: >-
                      Analyze this denied medical claim and provide a JSON response with:
                      {"denialReason": "classification", "successProbability": 0-100, 
                      "appealStrategy": "recommended strategy", "priorityScore": 1-10,
                      "keyFindings": ["finding1", "finding2"]}
            ResultPath: $.bedrockAnalysis
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.analysisError
                Next: UpdateStatusAnalysisFallback
            Next: UpdateStatusAnalysisFallback

          UpdateStatusAnalysisFallback:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
              Key:
                claimId:
                  S.$: $.claimId
              UpdateExpression: "SET processingStage = :stage, updatedAt = :time, analysisMethod = :method"
              ExpressionAttributeValues:
                ':stage':
                  S: ANALYSIS_COMPLETED
                ':time':
                  S.$: $$.State.EnteredTime
                ':method':
                  S: BEDROCK_FALLBACK
            ResultPath: $.updateResult
            Next: TransformFallbackAnalysis

          TransformFallbackAnalysis:
            Type: Pass
            Parameters:
              claimId.$: $.claimId
              patientId.$: $.patientId
              bucket.$: $.bucket
              key.$: $.key
              claimRecord.$: $.claimRecord
              textractJob.$: $.textractJob
              textractResults.$: $.textractResults
              medicalEntities.$: $.medicalEntities
              analysis.$: $.bedrockAnalysis.Body.content[0].text
            Next: InvokeAgentAppeal

          # =========================================================================
          # STEP 6: GENERATE APPEAL (Status: APPEAL_GENERATED)
          # =========================================================================
          InvokeAgentAppeal:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt InvokeAgentFunction.Arn
              Payload:
                claimId.$: $.claimId
                patientId.$: $.patientId
                bucket.$: $.bucket
                sourceKey.$: $.key
                extractedText.$: States.JsonToString($.textractResults.Blocks)
                medicalEntities.$: $.medicalEntities
                analysis.$: $.analysis
                action: appeal
            ResultPath: $.agentAppeal
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.appealError
                Next: FallbackAppealGeneration
            Next: UpdateStatusAppealGenerated

          UpdateStatusAppealGenerated:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
              Key:
                claimId:
                  S.$: $.claimId
              UpdateExpression: "SET processingStage = :stage, updatedAt = :time, appealMethod = :method"
              ExpressionAttributeValues:
                ':stage':
                  S: APPEAL_GENERATED
                ':time':
                  S.$: $$.State.EnteredTime
                ':method':
                  S: BEDROCK_AGENT
            ResultPath: $.updateResult
            Next: SaveAppealToS3

          # Fallback to direct Bedrock if Agent fails
          FallbackAppealGeneration:
            Type: Task
            Resource: arn:aws:states:::bedrock:invokeModel
            Parameters:
              ModelId: us.anthropic.claude-sonnet-4-5-20250929-v1:0
              ContentType: application/json
              Body:
                anthropic_version: bedrock-2023-05-31
                max_tokens: 8192
                messages:
                  - role: user
                    content: >-
                      Generate a professional medical claim appeal letter. Include:
                      1. Formal header with date and addresses
                      2. RE line with claim number and patient info
                      3. Clear statement of appeal
                      4. Medical necessity justification with clinical evidence
                      5. Reference to payer policy and coverage guidelines
                      6. Supporting documentation list
                      7. Request for expedited review if urgent
                      8. Professional closing
                      Format as a complete, ready-to-send letter.
            ResultPath: $.fallbackAppeal
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.fallbackError
                Next: SaveAnalysisResults
            Next: TransformFallbackAppeal

          TransformFallbackAppeal:
            Type: Pass
            Parameters:
              claimId.$: $.claimId
              patientId.$: $.patientId
              bucket.$: $.bucket
              key.$: $.key
              claimRecord.$: $.claimRecord
              textractJob.$: $.textractJob
              textractResults.$: $.textractResults
              medicalEntities.$: $.medicalEntities
              analysis.$: $.analysis
              agentAppeal:
                Payload:
                  agentResponse.$: $.fallbackAppeal.Body.content[0].text
            Next: UpdateStatusAppealFallback

          UpdateStatusAppealFallback:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
              Key:
                claimId:
                  S.$: $.claimId
              UpdateExpression: "SET processingStage = :stage, updatedAt = :time, appealMethod = :method"
              ExpressionAttributeValues:
                ':stage':
                  S: APPEAL_GENERATED
                ':time':
                  S.$: $$.State.EnteredTime
                ':method':
                  S: BEDROCK_FALLBACK
            ResultPath: $.updateResult
            Next: SaveAppealToS3

          # =========================================================================
          # STEP 7: SAVE APPEAL AS PDF (Status: APPEAL_SAVED)
          # =========================================================================
          SaveAppealToS3:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt GenerateAppealPdfFunction.Arn
              Payload:
                claimId.$: $.claimId
                appealText.$: $.agentAppeal.Payload.agentResponse
                bucket.$: $.bucket
                claimDetails.$: $.agentAppeal.Payload.claimDetails
                parsedEntities.$: $.agentAppeal.Payload.parsedEntities
            ResultPath: $.appealPdfResult
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.pdfError
                Next: SaveAppealAsTextFallback
            Next: UpdateStatusAppealSaved

          SaveAppealAsTextFallback:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:s3:putObject
            Parameters:
              Bucket.$: $.bucket
              Key.$: States.Format('appeals/{}/appeal_letter.txt', $.claimId)
              Body.$: $.agentAppeal.Payload.agentResponse
              ContentType: text/plain
            ResultPath: $.appealS3Result
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.s3Error
                Next: UpdateStatusS3Failed
            Next: UpdateStatusAppealSavedText

          UpdateStatusAppealSavedText:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
              Key:
                claimId:
                  S.$: $.claimId
              UpdateExpression: "SET processingStage = :stage, updatedAt = :time, appealLetterKey = :key, appealFormat = :format"
              ExpressionAttributeValues:
                ':stage':
                  S: APPEAL_SAVED
                ':time':
                  S.$: $$.State.EnteredTime
                ':key':
                  S.$: States.Format('appeals/{}/appeal_letter.txt', $.claimId)
                ':format':
                  S: TEXT
            ResultPath: $.updateResult
            Next: SaveAnalysisResults

          UpdateStatusAppealSaved:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
              Key:
                claimId:
                  S.$: $.claimId
              UpdateExpression: "SET processingStage = :stage, updatedAt = :time, appealLetterKey = :key, appealFormat = :format"
              ExpressionAttributeValues:
                ':stage':
                  S: APPEAL_SAVED
                ':time':
                  S.$: $$.State.EnteredTime
                ':key':
                  S.$: $.appealPdfResult.Payload.pdfKey
                ':format':
                  S: PDF
            ResultPath: $.updateResult
            Next: SaveAnalysisResults

          UpdateStatusS3Failed:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
              Key:
                claimId:
                  S.$: $.claimId
              UpdateExpression: "SET processingStage = :stage, updatedAt = :time, errorMessage = :error"
              ExpressionAttributeValues:
                ':stage':
                  S: APPEAL_SAVE_FAILED
                ':time':
                  S.$: $$.State.EnteredTime
                ':error':
                  S: Failed to save appeal letter to S3
            ResultPath: $.updateResult
            Next: SaveAnalysisResults

          # =========================================================================
          # STEP 8: SAVE ANALYSIS TO DYNAMODB (Status: ANALYSIS_SAVED)
          # =========================================================================
          SaveAnalysisResults:
            Type: Task
            Resource: arn:aws:states:::dynamodb:putItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-DenialAnalysisTable'
              Item:
                claimId:
                  S.$: $.claimId
                analysisId:
                  S.$: States.UUID()
                textractJobId:
                  S.$: $.textractJob.JobId
                analysisTimestamp:
                  S.$: $$.State.EnteredTime
                status:
                  S: ANALYZED
                agentAnalysis:
                  S.$: $.analysis
            ResultPath: $.analysisRecord
            Next: UpdateStatusAnalysisSaved

          UpdateStatusAnalysisSaved:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
              Key:
                claimId:
                  S.$: $.claimId
              UpdateExpression: "SET processingStage = :stage, updatedAt = :time, analysisJson = :analysis, appealLetterText = :appealText, payer = :payer, patientName = :patientName"
              ExpressionAttributeValues:
                ':stage':
                  S: ANALYSIS_SAVED
                ':time':
                  S.$: $$.State.EnteredTime
                ':analysis':
                  S.$: $.analysis
                ':appealText':
                  S.$: $.agentAppeal.Payload.agentResponse
                ':payer':
                  S.$: $.payer
                ':patientName':
                  S.$: $.patientName
            ResultPath: $.updateResult
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.analysisSaveError
                Next: CreateAppealOutcome
            Next: CreateAppealOutcome

          # =========================================================================
          # STEP 8.5: CREATE APPEAL OUTCOME RECORD
          # =========================================================================
          CreateAppealOutcome:
            Type: Task
            Resource: arn:aws:states:::dynamodb:putItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-AppealOutcomesTable'
              Item:
                claimId:
                  S.$: $.claimId
                appealId:
                  S.$: States.Format('APL-{}', $.claimId)
                patientId:
                  S.$: $.patientId
                payerId:
                  S: UNKNOWN
                outcome:
                  S: PENDING
                appealDate:
                  S.$: $$.State.EnteredTime
                outcomeDate:
                  S.$: $$.State.EnteredTime
                appealLetterKey:
                  S.$: States.Format('appeals/{}/appeal_letter.pdf', $.claimId)
                sourceDocument:
                  S.$: $.key
                createdAt:
                  S.$: $$.State.EnteredTime
            ResultPath: $.appealOutcomeRecord
            Next: AddToPriorityQueue

          # =========================================================================
          # STEP 8.6: ADD TO PRIORITY QUEUE
          # =========================================================================
          AddToPriorityQueue:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt PriorityQueueFunction.Arn
              Payload:
                claimId.$: $.claimId
                patientId.$: $.patientId
                analysis.$: $.analysis
                sourceDocument.$: $.key
                timestamp.$: $$.State.EnteredTime
            ResultPath: $.priorityQueueResult
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.priorityQueueError
                Next: UpdateClaimStatus
            Next: UpdateClaimStatus

          # =========================================================================
          # STEP 9: FINAL STATUS UPDATE (Status: COMPLETED)
          # =========================================================================
          UpdateClaimStatus:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
              Key:
                claimId:
                  S.$: $.claimId
              UpdateExpression: "SET #status = :status, updatedAt = :time, processingStage = :stage, completedAt = :completed"
              ExpressionAttributeNames:
                '#status': status
              ExpressionAttributeValues:
                ':status':
                  S: COMPLETED
                ':time':
                  S.$: $$.State.EnteredTime
                ':stage':
                  S: PROCESSING_COMPLETE
                ':completed':
                  S.$: $$.State.EnteredTime
            Next: ProcessingComplete

          ProcessingComplete:
            Type: Succeed

          ProcessingFailed:
            Type: Fail
            Error: ProcessingError
            Cause: Document processing failed
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment


  # ---------------------------------------------------------------------------
  # S3 Bucket Notification Configuration
  # ---------------------------------------------------------------------------
  S3NotificationFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3NotificationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                Resource:
                  Fn::ImportValue: !Sub '${DataStackName}-DataBucketArn'

  S3NotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-s3-notification-helper'
      Runtime: python3.11
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt S3NotificationFunctionRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import cfnresponse
          
          s3 = boto3.client('s3')
          
          def handler(event, context):
              try:
                  bucket = event['ResourceProperties']['BucketName']
                  
                  if event['RequestType'] == 'Delete':
                      try:
                          s3.put_bucket_notification_configuration(
                              Bucket=bucket,
                              NotificationConfiguration={}
                          )
                      except Exception as e:
                          print(f"Delete cleanup error (ignored): {e}")
                  else:
                      config = event['ResourceProperties']['NotificationConfiguration']
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration=config
                      )
                  
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  print(f"Error: {e}")
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  else:
                      cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  DataBucketNotification:
    Type: Custom::S3BucketNotification
    DependsOn:
      - S3TriggerPermission
    Properties:
      ServiceToken: !GetAtt S3NotificationFunction.Arn
      BucketName:
        Fn::ImportValue: !Sub '${DataStackName}-DataBucket'
      NotificationConfiguration:
        LambdaFunctionConfigurations:
          - Events:
              - 's3:ObjectCreated:*'
            LambdaFunctionArn: !GetAtt S3TriggerFunction.Arn
            Filter:
              Key:
                FilterRules:
                  - Name: prefix
                    Value: intake/

# =============================================================================
# BATCH PROCESSING
# =============================================================================

  # ---------------------------------------------------------------------------
  # SQS-Based Batch Processing - IAM Role
  # ---------------------------------------------------------------------------
  SQSProcessorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-sqs-processor-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SQSProcessorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # SQS permissions
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-ClaimsQueueArn'
                  - Fn::ImportValue: !Sub '${DataStackName}-HighPriorityQueueArn'
              # Step Functions permissions
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  - !Ref FullPipelineStateMachine
                  - !Ref DenialProcessingStateMachine
              # S3 permissions
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 
                    - '${BucketArn}/*'
                    - BucketArn:
                        Fn::ImportValue: !Sub '${DataStackName}-DataBucketArn'
              # KMS permissions
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-KMSKey'

  # ---------------------------------------------------------------------------
  # Lambda Function - SQS Message Processor
  # ---------------------------------------------------------------------------
  SQSProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-sqs-processor'
      Description: Processes SQS messages and starts Step Functions executions
      Runtime: python3.11
      Handler: index.handler
      MemorySize: 256
      Timeout: 120
      Role: !GetAtt SQSProcessorLambdaRole.Arn
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref FullPipelineStateMachine
          LOG_LEVEL: !If [IsProd, 'INFO', 'DEBUG']
      Code:
        ZipFile: |
          import os
          import json
          import logging
          import boto3
          from urllib.parse import unquote_plus

          logger = logging.getLogger()
          logger.setLevel(os.environ.get('LOG_LEVEL', 'INFO'))

          sfn = boto3.client('stepfunctions')
          STATE_MACHINE_ARN = os.environ['STATE_MACHINE_ARN']

          def handler(event, context):
              """
              Process SQS messages containing S3 event notifications.
              Each message triggers a Step Functions execution.
              """
              logger.info(f"Received {len(event.get('Records', []))} SQS messages")
              
              executions = []
              failed_messages = []
              
              for record in event.get('Records', []):
                  message_id = record.get('messageId', 'unknown')
                  
                  try:
                      # Parse SQS message body (contains S3 event)
                      body = json.loads(record.get('body', '{}'))
                      
                      # Handle S3 event notification format
                      s3_records = body.get('Records', [])
                      if not s3_records:
                          # Direct message format (not from S3 notification)
                          if 'bucket' in body and 'key' in body:
                              s3_records = [{'s3': {'bucket': {'name': body['bucket']}, 'object': {'key': body['key']}}}]
                          else:
                              logger.warning(f"No S3 records in message {message_id}")
                              continue
                      
                      for s3_record in s3_records:
                          bucket = s3_record['s3']['bucket']['name']
                          key = unquote_plus(s3_record['s3']['object']['key'])
                          
                          # Only process document files
                          if not any(key.lower().endswith(ext) for ext in ['.pdf', '.png', '.jpg', '.jpeg', '.tiff']):
                              logger.info(f"Skipping non-document: {key}")
                              continue
                          
                          # Build execution input
                          input_data = {
                              'bucket': bucket,
                              'key': key,
                              'sqsMessageId': message_id,
                              'eventTime': s3_record.get('eventTime', ''),
                              'source': 'sqs-batch'
                          }
                          
                          # Generate unique execution name
                          safe_key = key.replace('/', '-').replace('.', '-')[:50]
                          execution_name = f"sqs-{safe_key}-{context.aws_request_id[:8]}"
                          
                          # Start Step Functions execution
                          response = sfn.start_execution(
                              stateMachineArn=STATE_MACHINE_ARN,
                              name=execution_name,
                              input=json.dumps(input_data)
                          )
                          
                          logger.info(f"Started execution: {response['executionArn']}")
                          executions.append({
                              'executionArn': response['executionArn'],
                              'messageId': message_id,
                              'key': key
                          })
                          
                  except Exception as e:
                      logger.error(f"Error processing message {message_id}: {str(e)}")
                      failed_messages.append({
                          'messageId': message_id,
                          'error': str(e)
                      })
              
              result = {
                  'processedMessages': len(executions),
                  'failedMessages': len(failed_messages),
                  'executions': executions
              }
              
              if failed_messages:
                  result['failures'] = failed_messages
                  # Raise error to trigger SQS retry for failed messages
                  if len(failed_messages) == len(event.get('Records', [])):
                      raise Exception(f"All messages failed: {failed_messages}")
              
              return result
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  SQSProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SQSProcessorFunction}'
      RetentionInDays: !If [IsProd, 365, 30]

  # ---------------------------------------------------------------------------
  # SQS Event Source Mapping - Standard Queue
  # ---------------------------------------------------------------------------
  SQSEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn:
        Fn::ImportValue: !Sub '${DataStackName}-ClaimsQueueArn'
      FunctionName: !GetAtt SQSProcessorFunction.Arn
      BatchSize: 5  # Process up to 5 messages at a time
      MaximumBatchingWindowInSeconds: 30  # Wait up to 30 seconds to batch messages
      Enabled: true
      FunctionResponseTypes:
        - ReportBatchItemFailures  # Enable partial batch failure reporting

  # ---------------------------------------------------------------------------
  # SQS Event Source Mapping - High Priority Queue
  # ---------------------------------------------------------------------------
  HighPrioritySQSEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn:
        Fn::ImportValue: !Sub '${DataStackName}-HighPriorityQueueArn'
      FunctionName: !GetAtt SQSProcessorFunction.Arn
      BatchSize: 1  # Process high priority claims immediately
      MaximumBatchingWindowInSeconds: 0  # No batching delay for high priority
      Enabled: true
      FunctionResponseTypes:
        - ReportBatchItemFailures

  # ---------------------------------------------------------------------------
  # Lambda Function - Enqueue Claims to SQS
  # ---------------------------------------------------------------------------
  EnqueueClaimsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-enqueue-claims-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EnqueueClaimsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:SendMessageBatch
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-ClaimsQueueArn'
                  - Fn::ImportValue: !Sub '${DataStackName}-HighPriorityQueueArn'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-DataBucketArn'
                  - !Sub 
                    - '${BucketArn}/*'
                    - BucketArn:
                        Fn::ImportValue: !Sub '${DataStackName}-DataBucketArn'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-KMSKey'

  EnqueueClaimsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-enqueue-claims'
      Description: Enqueues claims from S3 to SQS for batch processing
      Runtime: python3.11
      Handler: index.handler
      MemorySize: 256
      Timeout: 300
      Role: !GetAtt EnqueueClaimsLambdaRole.Arn
      Environment:
        Variables:
          DATA_BUCKET:
            Fn::ImportValue: !Sub '${DataStackName}-DataBucket'
          CLAIMS_QUEUE_URL:
            Fn::ImportValue: !Sub '${DataStackName}-ClaimsQueueUrl'
          HIGH_PRIORITY_QUEUE_URL:
            Fn::ImportValue: !Sub '${DataStackName}-HighPriorityQueueUrl'
          LOG_LEVEL: !If [IsProd, 'INFO', 'DEBUG']
      Code:
        ZipFile: |
          import os
          import json
          import logging
          import boto3
          from datetime import datetime

          logger = logging.getLogger()
          logger.setLevel(os.environ.get('LOG_LEVEL', 'INFO'))

          s3 = boto3.client('s3')
          sqs = boto3.client('sqs')

          DATA_BUCKET = os.environ['DATA_BUCKET']
          CLAIMS_QUEUE_URL = os.environ['CLAIMS_QUEUE_URL']
          HIGH_PRIORITY_QUEUE_URL = os.environ['HIGH_PRIORITY_QUEUE_URL']

          def handler(event, context):
              """
              Enqueue claims from S3 to SQS for batch processing.
              
              Input:
              {
                  "prefix": "intake/",           # S3 prefix to scan
                  "maxFiles": 100,               # Maximum files to enqueue
                  "highPriority": false,         # Use high priority queue
                  "delaySeconds": 0              # Delay before processing (0-900)
              }
              """
              prefix = event.get('prefix', 'intake/')
              max_files = event.get('maxFiles', 100)
              high_priority = event.get('highPriority', False)
              delay_seconds = min(event.get('delaySeconds', 0), 900)
              
              queue_url = HIGH_PRIORITY_QUEUE_URL if high_priority else CLAIMS_QUEUE_URL
              
              logger.info(f"Scanning s3://{DATA_BUCKET}/{prefix} for up to {max_files} files")
              
              files = []
              paginator = s3.get_paginator('list_objects_v2')
              
              for page in paginator.paginate(Bucket=DATA_BUCKET, Prefix=prefix):
                  for obj in page.get('Contents', []):
                      key = obj['Key']
                      if any(key.lower().endswith(ext) for ext in ['.pdf', '.png', '.jpg', '.jpeg', '.tiff']):
                          files.append({
                              'bucket': DATA_BUCKET,
                              'key': key,
                              'size': obj['Size'],
                              'lastModified': obj['LastModified'].isoformat()
                          })
                      if len(files) >= max_files:
                          break
                  if len(files) >= max_files:
                      break
              
              logger.info(f"Found {len(files)} files to enqueue")
              
              # Send messages in batches of 10 (SQS limit)
              enqueued = 0
              failed = 0
              batch_id = context.aws_request_id
              
              for i in range(0, len(files), 10):
                  batch = files[i:i+10]
                  entries = []
                  
                  for j, file in enumerate(batch):
                      message_body = {
                          'Records': [{
                              's3': {
                                  'bucket': {'name': file['bucket']},
                                  'object': {'key': file['key']}
                              },
                              'eventTime': datetime.utcnow().isoformat()
                          }]
                      }
                      
                      entries.append({
                          'Id': str(i + j),
                          'MessageBody': json.dumps(message_body),
                          'DelaySeconds': delay_seconds,
                          'MessageAttributes': {
                              'BatchId': {
                                  'DataType': 'String',
                                  'StringValue': batch_id
                              },
                              'Priority': {
                                  'DataType': 'String',
                                  'StringValue': 'high' if high_priority else 'normal'
                              }
                          }
                      })
                  
                  try:
                      response = sqs.send_message_batch(
                          QueueUrl=queue_url,
                          Entries=entries
                      )
                      
                      enqueued += len(response.get('Successful', []))
                      failed += len(response.get('Failed', []))
                      
                      if response.get('Failed'):
                          logger.warning(f"Failed to enqueue: {response['Failed']}")
                          
                  except Exception as e:
                      logger.error(f"Error sending batch: {str(e)}")
                      failed += len(entries)
              
              return {
                  'batchId': batch_id,
                  'totalFiles': len(files),
                  'enqueued': enqueued,
                  'failed': failed,
                  'queueUrl': queue_url,
                  'highPriority': high_priority
              }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  EnqueueClaimsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EnqueueClaimsFunction}'
      RetentionInDays: !If [IsProd, 365, 30]

  # ---------------------------------------------------------------------------
  # Lambda Function - List Batch Files
  # ---------------------------------------------------------------------------
  ListBatchFilesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-list-batch-files'
      Description: Lists files in S3 for batch processing
      Runtime: python3.11
      Handler: index.handler
      MemorySize: 256
      Timeout: 60
      Role: !GetAtt TriggerLambdaRole.Arn
      Environment:
        Variables:
          DATA_BUCKET:
            Fn::ImportValue: !Sub '${DataStackName}-DataBucket'
      Code:
        ZipFile: |
          import os
          import json
          import boto3

          s3 = boto3.client('s3')
          DATA_BUCKET = os.environ['DATA_BUCKET']

          def handler(event, context):
              # Get prefix from input or default to intake/
              prefix = event.get('prefix', 'intake/')
              bucket = event.get('bucket', DATA_BUCKET)
              max_files = event.get('maxFiles', 100)
              
              files = []
              paginator = s3.get_paginator('list_objects_v2')
              
              for page in paginator.paginate(Bucket=bucket, Prefix=prefix):
                  for obj in page.get('Contents', []):
                      key = obj['Key']
                      # Only include document files
                      if any(key.lower().endswith(ext) for ext in ['.pdf', '.png', '.jpg', '.jpeg', '.tiff']):
                          files.append({
                              'bucket': bucket,
                              'key': key,
                              'size': obj['Size'],
                              'lastModified': obj['LastModified'].isoformat()
                          })
                      if len(files) >= max_files:
                          break
                  if len(files) >= max_files:
                      break
              
              return {
                  'batchId': context.aws_request_id,
                  'totalFiles': len(files),
                  'files': files
              }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Lambda Function - Generate Batch Report
  # ---------------------------------------------------------------------------
  GenerateBatchReportFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-generate-batch-report'
      Description: Generates summary report for batch processing
      Runtime: python3.11
      Handler: index.handler
      MemorySize: 256
      Timeout: 60
      Role: !GetAtt TriggerLambdaRole.Arn
      Environment:
        Variables:
          DATA_BUCKET:
            Fn::ImportValue: !Sub '${DataStackName}-DataBucket'
      Code:
        ZipFile: |
          import os
          import json
          import boto3
          from datetime import datetime

          s3 = boto3.client('s3')
          DATA_BUCKET = os.environ['DATA_BUCKET']

          def handler(event, context):
              batch_id = event.get('batchId', 'unknown')
              results = event.get('results', [])
              
              # Calculate statistics
              total = len(results)
              successful = sum(1 for r in results if r.get('status') == 'APPEAL_GENERATED')
              failed = sum(1 for r in results if r.get('status') == 'FAILED')
              
              # Calculate recovery metrics
              total_claim_amount = 0
              total_expected_recovery = 0
              high_priority = 0
              
              for r in results:
                  analysis = r.get('analysis', {})
                  if isinstance(analysis, str):
                      try:
                          analysis = json.loads(analysis)
                      except:
                          analysis = {}
                  
                  total_claim_amount += analysis.get('dollarImpact', 0)
                  total_expected_recovery += analysis.get('expectedRecovery', 0)
                  if analysis.get('priorityScore', 0) >= 7:
                      high_priority += 1
              
              report = {
                  'batchId': batch_id,
                  'timestamp': datetime.utcnow().isoformat(),
                  'summary': {
                      'totalClaims': total,
                      'successful': successful,
                      'failed': failed,
                      'successRate': round(successful / total * 100, 2) if total > 0 else 0
                  },
                  'financials': {
                      'totalClaimAmount': round(total_claim_amount, 2),
                      'totalExpectedRecovery': round(total_expected_recovery, 2),
                      'averageRecoveryRate': round(total_expected_recovery / total_claim_amount * 100, 2) if total_claim_amount > 0 else 0
                  },
                  'priority': {
                      'highPriorityClaims': high_priority,
                      'highPriorityPercentage': round(high_priority / total * 100, 2) if total > 0 else 0
                  },
                  'claims': results
              }
              
              # Save report to S3
              report_key = f'batch-reports/{batch_id}/report.json'
              s3.put_object(
                  Bucket=DATA_BUCKET,
                  Key=report_key,
                  Body=json.dumps(report, indent=2),
                  ContentType='application/json'
              )
              
              return {
                  'reportKey': report_key,
                  'summary': report['summary'],
                  'financials': report['financials'],
                  'priority': report['priority']
              }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Batch Processing State Machine
  # ---------------------------------------------------------------------------
  BatchProcessingStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ProjectName}-${Environment}-batch-processing'
      RoleArn: !GetAtt StepFunctionsRole.Arn
      Definition:
        Comment: DenialRecover AI - Batch Processing Pipeline with Map State
        StartAt: ListFilesToProcess
        States:
          # =========================================================================
          # STEP 1: List all files to process
          # =========================================================================
          ListFilesToProcess:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt ListBatchFilesFunction.Arn
              Payload:
                prefix.$: $.prefix
                maxFiles.$: $.maxFiles
            ResultPath: $.batchInfo
            ResultSelector:
              batchId.$: $.Payload.batchId
              totalFiles.$: $.Payload.totalFiles
              files.$: $.Payload.files
            Next: ProcessClaimsBatch

          # =========================================================================
          # STEP 2: Map State - Process each claim in parallel
          # =========================================================================
          ProcessClaimsBatch:
            Type: Map
            ItemsPath: $.batchInfo.files
            MaxConcurrency: 5
            Parameters:
              bucket.$: $$.Map.Item.Value.bucket
              key.$: $$.Map.Item.Value.key
              batchId.$: $.batchInfo.batchId
            Iterator:
              StartAt: GenerateClaimId
              States:
                GenerateClaimId:
                  Type: Pass
                  Parameters:
                    bucket.$: $.bucket
                    key.$: $.key
                    batchId.$: $.batchId
                    claimId.$: States.UUID()
                  Next: CreateClaimRecord

                CreateClaimRecord:
                  Type: Task
                  Resource: arn:aws:states:::dynamodb:putItem
                  Parameters:
                    TableName:
                      Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
                    Item:
                      claimId:
                        S.$: $.claimId
                      status:
                        S: PROCESSING
                      batchId:
                        S.$: $.batchId
                      sourceDocument:
                        M:
                          bucket:
                            S.$: $.bucket
                          key:
                            S.$: $.key
                      createdAt:
                        S.$: $$.State.EnteredTime
                      updatedAt:
                        S.$: $$.State.EnteredTime
                  ResultPath: $.claimRecord
                  Next: StartTextract

                StartTextract:
                  Type: Task
                  Resource: arn:aws:states:::aws-sdk:textract:startDocumentAnalysis
                  Parameters:
                    DocumentLocation:
                      S3Object:
                        Bucket.$: $.bucket
                        Name.$: $.key
                    FeatureTypes:
                      - FORMS
                      - TABLES
                  ResultPath: $.textractJob
                  Retry:
                    - ErrorEquals:
                        - Textract.ProvisionedThroughputExceededException
                        - Textract.ThrottlingException
                        - States.TaskFailed
                      IntervalSeconds: 10
                      MaxAttempts: 6
                      BackoffRate: 2
                  Catch:
                    - ErrorEquals:
                        - States.ALL
                      ResultPath: $.error
                      Next: ClaimFailed
                  Next: WaitForTextract

                WaitForTextract:
                  Type: Wait
                  Seconds: 10
                  Next: CheckTextractStatus

                CheckTextractStatus:
                  Type: Task
                  Resource: arn:aws:states:::aws-sdk:textract:getDocumentAnalysis
                  Parameters:
                    JobId.$: $.textractJob.JobId
                    MaxResults: 1
                  ResultPath: $.textractStatus
                  Retry:
                    - ErrorEquals:
                        - Textract.ProvisionedThroughputExceededException
                        - Textract.ThrottlingException
                        - States.TaskFailed
                      IntervalSeconds: 5
                      MaxAttempts: 5
                      BackoffRate: 2
                  Next: IsTextractComplete

                IsTextractComplete:
                  Type: Choice
                  Choices:
                    - Variable: $.textractStatus.JobStatus
                      StringEquals: SUCCEEDED
                      Next: GetTextractResults
                    - Variable: $.textractStatus.JobStatus
                      StringEquals: FAILED
                      Next: ClaimFailed
                  Default: WaitForTextract

                GetTextractResults:
                  Type: Task
                  Resource: arn:aws:states:::aws-sdk:textract:getDocumentAnalysis
                  Parameters:
                    JobId.$: $.textractJob.JobId
                  ResultPath: $.textractResults
                  Retry:
                    - ErrorEquals:
                        - Textract.ProvisionedThroughputExceededException
                        - Textract.ThrottlingException
                        - States.TaskFailed
                      IntervalSeconds: 5
                      MaxAttempts: 5
                      BackoffRate: 2
                  Next: ExtractMedicalEntities

                ExtractMedicalEntities:
                  Type: Task
                  Resource: arn:aws:states:::aws-sdk:comprehendmedical:detectEntitiesV2
                  Parameters:
                    Text.$: States.ArrayGetItem($.textractResults.Blocks[?(@.BlockType=='LINE')].Text, 0)
                  ResultPath: $.medicalEntities
                  Catch:
                    - ErrorEquals:
                        - States.ALL
                      Next: InvokeAgentAnalysis
                  Next: InvokeAgentAnalysis

                InvokeAgentAnalysis:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: !GetAtt InvokeAgentFunction.Arn
                    Payload:
                      claimId.$: $.claimId
                      extractedText.$: States.JsonToString($.textractResults.Blocks)
                      medicalEntities.$: $.medicalEntities
                      action: analyze
                  ResultPath: $.agentAnalysis
                  Catch:
                    - ErrorEquals:
                        - States.ALL
                      ResultPath: $.analysisError
                      Next: InvokeAgentAppeal
                  Next: ParseAnalysis

                ParseAnalysis:
                  Type: Pass
                  Parameters:
                    claimId.$: $.claimId
                    bucket.$: $.bucket
                    key.$: $.key
                    batchId.$: $.batchId
                    claimRecord.$: $.claimRecord
                    textractJob.$: $.textractJob
                    textractResults.$: $.textractResults
                    medicalEntities.$: $.medicalEntities
                    analysis.$: $.agentAnalysis.Payload.agentResponse
                  Next: InvokeAgentAppeal

                InvokeAgentAppeal:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: !GetAtt InvokeAgentFunction.Arn
                    Payload:
                      claimId.$: $.claimId
                      extractedText.$: States.JsonToString($.textractResults.Blocks)
                      medicalEntities.$: $.medicalEntities
                      analysis.$: $.analysis
                      action: generate_appeal
                  ResultPath: $.agentAppeal
                  Catch:
                    - ErrorEquals:
                        - States.ALL
                      ResultPath: $.appealError
                      Next: SaveAnalysisResults
                  Next: SaveAppealAsPdf

                SaveAppealAsPdf:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: !GetAtt GenerateAppealPdfFunction.Arn
                    Payload:
                      claimId.$: $.claimId
                      appealText.$: $.agentAppeal.Payload.agentResponse
                      bucket.$: $.bucket
                      claimDetails.$: $.agentAppeal.Payload.claimDetails
                      parsedEntities.$: $.agentAppeal.Payload.parsedEntities
                  ResultPath: $.appealPdfResult
                  Catch:
                    - ErrorEquals:
                        - States.ALL
                      ResultPath: $.pdfError
                      Next: SaveAppealAsTextFallback
                  Next: SaveAnalysisResults

                SaveAppealAsTextFallback:
                  Type: Task
                  Resource: arn:aws:states:::aws-sdk:s3:putObject
                  Parameters:
                    Bucket.$: $.bucket
                    Key.$: States.Format('appeals/{}/appeal_letter.txt', $.claimId)
                    Body.$: $.agentAppeal.Payload.agentResponse
                    ContentType: text/plain
                  ResultPath: $.appealS3Result
                  Catch:
                    - ErrorEquals:
                        - States.ALL
                      ResultPath: $.s3Error
                      Next: SaveAnalysisResults
                  Next: SaveAnalysisResults

                SaveAnalysisResults:
                  Type: Task
                  Resource: arn:aws:states:::dynamodb:putItem
                  Parameters:
                    TableName:
                      Fn::ImportValue: !Sub '${DataStackName}-DenialAnalysisTable'
                    Item:
                      claimId:
                        S.$: $.claimId
                      analysisId:
                        S.$: States.UUID()
                      batchId:
                        S.$: $.batchId
                      textractJobId:
                        S.$: $.textractJob.JobId
                      analysisTimestamp:
                        S.$: $$.State.EnteredTime
                      status:
                        S: ANALYZED
                      agentAnalysis:
                        S.$: $.analysis
                  ResultPath: $.analysisRecord
                  Next: UpdateClaimStatus

                UpdateClaimStatus:
                  Type: Task
                  Resource: arn:aws:states:::dynamodb:updateItem
                  Parameters:
                    TableName:
                      Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
                    Key:
                      claimId:
                        S.$: $.claimId
                    UpdateExpression: "SET #status = :status, updatedAt = :time, processingStage = :stage, appealLetterKey = :appealKey, appealFormat = :format"
                    ExpressionAttributeNames:
                      '#status': status
                    ExpressionAttributeValues:
                      ':status':
                        S: APPEAL_GENERATED
                      ':time':
                        S.$: $$.State.EnteredTime
                      ':stage':
                        S: APPEAL_LETTER_GENERATED
                      ':appealKey':
                        S.$: States.Format('appeals/{}/appeal_letter.pdf', $.claimId)
                      ':format':
                        S: PDF
                  ResultPath: $.updateResult
                  Next: ClaimSuccess

                ClaimSuccess:
                  Type: Pass
                  Parameters:
                    claimId.$: $.claimId
                    status: APPEAL_GENERATED
                    analysis.$: $.analysis
                    appealKey.$: States.Format('appeals/{}/appeal_letter.pdf', $.claimId)
                  End: true

                ClaimFailed:
                  Type: Pass
                  Parameters:
                    claimId.$: $.claimId
                    status: FAILED
                    error.$: $.error
                  End: true

            ResultPath: $.results
            Next: GenerateBatchReport

          # =========================================================================
          # STEP 3: Generate batch summary report
          # =========================================================================
          GenerateBatchReport:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt GenerateBatchReportFunction.Arn
              Payload:
                batchId.$: $.batchInfo.batchId
                results.$: $.results
            ResultPath: $.report
            ResultSelector:
              reportKey.$: $.Payload.reportKey
              summary.$: $.Payload.summary
              financials.$: $.Payload.financials
              priority.$: $.Payload.priority
            Next: BatchComplete

          BatchComplete:
            Type: Succeed

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # NEW: Full Pipeline State Machine
  # All files -> async Textract -> Comprehend -> Claude + RAG
  # ---------------------------------------------------------------------------
  FullPipelineStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ProjectName}-${Environment}-full-pipeline'
      RoleArn: !GetAtt StepFunctionsRole.Arn
      Definition:
        Comment: DenialRecover AI - Full Pipeline with parallel Textract on all files
        StartAt: WaitForBatchUpload

        States:

          # ?? Step 0: Wait for batch upload to complete ????????????????????????
          WaitForBatchUpload:
            Type: Wait
            Seconds: 30
            Next: CreateClaimRecord

          # ?? Step 1: Create claim record ??????????????????????????????????????
          CreateClaimRecord:
            Type: Task
            Resource: arn:aws:states:::dynamodb:putItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
              Item:
                claimId:
                  S.$: $.claimId
                patientId:
                  S.$: $.patientId
                status:
                  S: RECEIVED
                processingStage:
                  S: CLAIM_CREATED
                sourceDocument:
                  M:
                    bucket:
                      S.$: $.bucket
                    key:
                      S.$: $.key
                createdAt:
                  S.$: $$.State.EnteredTime
                updatedAt:
                  S.$: $$.State.EnteredTime
            ResultPath: $.claimRecord
            Next: ListRelatedFiles

          # ?? Step 2: List all related files ???????????????????????????????????
          ListRelatedFiles:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt ListRelatedFilesFunction.Arn
              Payload:
                claimId.$: $.claimId
                patientId.$: $.patientId
                bucket.$: $.bucket
                key.$: $.key
            ResultPath: $.relatedFiles
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.listError
                Next: FallbackSingleFile
            Next: ProcessAllFilesParallel

          # ?? Step 3: Parallel async Textract on ALL files ??????????????????????
          ProcessAllFilesParallel:
            Type: Map
            ItemsPath: $.relatedFiles.Payload.files
            ItemSelector:
              bucket.$: $$.Map.Item.Value.bucket
              key.$: $$.Map.Item.Value.key
              docType.$: $$.Map.Item.Value.docType
              claimId.$: $$.Map.Item.Value.claimId
            MaxConcurrency: 5
            ResultPath: $.allFileResults
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.parallelError
                Next: FallbackSingleFile
            Iterator:
              StartAt: StartFileTextract
              States:

                StartFileTextract:
                  Type: Task
                  Resource: arn:aws:states:::aws-sdk:textract:startDocumentAnalysis
                  Parameters:
                    DocumentLocation:
                      S3Object:
                        Bucket.$: $.bucket
                        Name.$: $.key
                    FeatureTypes:
                      - FORMS
                      - TABLES
                  ResultPath: $.textractJob
                  Retry:
                    - ErrorEquals:
                        - Textract.ProvisionedThroughputExceededException
                        - Textract.ThrottlingException
                        - States.TaskFailed
                      IntervalSeconds: 10
                      MaxAttempts: 6
                      BackoffRate: 2
                  Catch:
                    - ErrorEquals:
                        - States.ALL
                      ResultPath: $.textractError
                      Next: ReturnEmptyResult
                  Next: WaitForFileTextract

                WaitForFileTextract:
                  Type: Wait
                  Seconds: 10
                  Next: CheckFileTextractStatus

                CheckFileTextractStatus:
                  Type: Task
                  Resource: arn:aws:states:::aws-sdk:textract:getDocumentAnalysis
                  Parameters:
                    JobId.$: $.textractJob.JobId
                    MaxResults: 1
                  ResultPath: $.textractStatus
                  Retry:
                    - ErrorEquals:
                        - Textract.ProvisionedThroughputExceededException
                        - Textract.ThrottlingException
                        - States.TaskFailed
                      IntervalSeconds: 5
                      MaxAttempts: 5
                      BackoffRate: 2
                  Next: IsFileTextractComplete

                IsFileTextractComplete:
                  Type: Choice
                  Choices:
                    - Variable: $.textractStatus.JobStatus
                      StringEquals: SUCCEEDED
                      Next: GetFileTextractResults
                    - Variable: $.textractStatus.JobStatus
                      StringEquals: FAILED
                      Next: ReturnEmptyResult
                  Default: WaitForFileTextract

                GetFileTextractResults:
                  Type: Task
                  Resource: arn:aws:states:::aws-sdk:textract:getDocumentAnalysis
                  Parameters:
                    JobId.$: $.textractJob.JobId
                  ResultPath: $.textractResults
                  Retry:
                    - ErrorEquals:
                        - Textract.ProvisionedThroughputExceededException
                        - Textract.ThrottlingException
                        - States.TaskFailed
                      IntervalSeconds: 5
                      MaxAttempts: 5
                      BackoffRate: 2
                  Next: ReturnFileResult

                ReturnFileResult:
                  Type: Task
                  Resource: arn:aws:states:::aws-sdk:s3:putObject
                  Parameters:
                    Bucket.$: $.bucket
                    Key.$: States.Format('textract-results/{}/{}.json', $.claimId, $.textractJob.JobId)
                    Body.$: States.JsonToString($.textractResults.Blocks)
                    ContentType: application/json
                  ResultPath: $.s3PutResult
                  Next: ReturnFileMetadata

                ReturnFileMetadata:
                  Type: Pass
                  Parameters:
                    key.$: $.key
                    docType.$: $.docType
                    claimId.$: $.claimId
                    bucket.$: $.bucket
                    textractS3Key.$: States.Format('textract-results/{}/{}.json', $.claimId, $.textractJob.JobId)
                  End: true

                ReturnEmptyResult:
                  Type: Pass
                  Parameters:
                    key.$: $.key
                    docType.$: $.docType
                    claimId.$: $.claimId
                    bucket.$: $.bucket
                    textractS3Key: ''
                  End: true

            Next: MergeAllResults

          # ?? Step 4: Merge all results + run Comprehend Medical ????????????????
          MergeAllResults:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt MergeTextractResultsFunction.Arn
              Payload:
                claimId.$: $.claimId
                patientId.$: $.patientId
                bucket.$: $.bucket
                claimKey.$: $.key
                fileResults.$: $.allFileResults
            ResultPath: $.mergedResults
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.mergeError
                Next: FallbackSingleFile
            Next: UpdateStatusMerged

          UpdateStatusMerged:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
              Key:
                claimId:
                  S.$: $.claimId
              UpdateExpression: "SET processingStage = :stage, updatedAt = :time"
              ExpressionAttributeValues:
                ':stage':
                  S: ALL_FILES_PROCESSED
                ':time':
                  S.$: $$.State.EnteredTime
            ResultPath: $.updateResult
            Next: InvokeAgentAnalysis

          # ?? Step 5: Analysis (Claude + RAG with ALL file context) ?????????????
          InvokeAgentAnalysis:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt InvokeAgentFunction.Arn
              Payload:
                claimId.$: $.claimId
                patientId.$: $.patientId
                bucket.$: $.bucket
                sourceKey.$: $.key
                extractedText.$: $.mergedResults.Payload.claimText
                medicalEntities.$: $.mergedResults.Payload.claimEntities
                relatedDocs.$: $.mergedResults.Payload.relatedDocs
                allEntities.$: $.mergedResults.Payload.allEntities
                action: analyze
            ResultPath: $.agentAnalysis
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.analysisError
                Next: SaveAnalysisAndComplete
            Next: ParseAnalysis

          ParseAnalysis:
            Type: Pass
            Parameters:
              claimId.$: $.claimId
              patientId.$: $.patientId
              bucket.$: $.bucket
              key.$: $.key
              mergedResults.$: $.mergedResults
              analysis.$: $.agentAnalysis.Payload.agentResponse
              payer.$: $.agentAnalysis.Payload.claimDetails.payer
              patientName.$: $.agentAnalysis.Payload.claimDetails.patientName
            Next: InvokeAgentAppeal

          # ?? Step 6: Appeal (Claude + RAG with ALL file context) ???????????????
          InvokeAgentAppeal:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt InvokeAgentFunction.Arn
              Payload:
                claimId.$: $.claimId
                patientId.$: $.patientId
                bucket.$: $.bucket
                sourceKey.$: $.key
                extractedText.$: $.mergedResults.Payload.claimText
                medicalEntities.$: $.mergedResults.Payload.claimEntities
                relatedDocs.$: $.mergedResults.Payload.relatedDocs
                allEntities.$: $.mergedResults.Payload.allEntities
                analysis.$: $.analysis
                action: appeal
            ResultPath: $.agentAppeal
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.appealError
                Next: SaveAnalysisAndComplete
            Next: GenerateAppealPdf

          GenerateAppealPdf:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt GenerateAppealPdfFunction.Arn
              Payload:
                claimId.$: $.claimId
                appealText.$: $.agentAppeal.Payload.agentResponse
                bucket.$: $.bucket
                claimDetails.$: $.agentAppeal.Payload.claimDetails
                parsedEntities.$: $.agentAppeal.Payload.parsedEntities
                analysisJson.$: $.analysis
            ResultPath: $.pdfResult
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.pdfError
                Next: SaveAnalysisAndComplete
            Next: SaveAnalysisAndComplete

          # ?? Step 7: Save results to DynamoDB ?????????????????????????????????
          SaveAnalysisAndComplete:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
              Key:
                claimId:
                  S.$: $.claimId
              UpdateExpression: "SET processingStage = :stage, #status = :status, updatedAt = :time, analysisJson = :analysis, appealLetterText = :appealText, appealLetterKey = :appealKey, payer = :payer, patientName = :patientName"
              ExpressionAttributeNames:
                '#status': status
              ExpressionAttributeValues:
                ':stage':
                  S: PROCESSING_COMPLETE
                ':status':
                  S: COMPLETED
                ':time':
                  S.$: $$.State.EnteredTime
                ':analysis':
                  S.$: $.analysis
                ':appealText':
                  S.$: $.agentAppeal.Payload.agentResponse
                ':appealKey':
                  S.$: States.Format('appeals/{}/appeal_letter.pdf', $.claimId)
                ':payer':
                  S.$: $.payer
                ':patientName':
                  S.$: $.patientName
            ResultPath: $.finalUpdate
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.saveError
                Next: PipelineComplete
            Next: CreateAppealOutcome

          CreateAppealOutcome:
            Type: Task
            Resource: arn:aws:states:::dynamodb:putItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-AppealOutcomesTable'
              Item:
                claimId:
                  S.$: $.claimId
                appealId:
                  S.$: States.Format('APL-{}', $.claimId)
                patientId:
                  S.$: $.patientId
                outcome:
                  S: PENDING
                appealDate:
                  S.$: $$.State.EnteredTime
                outcomeDate:
                  S.$: $$.State.EnteredTime
                appealLetterKey:
                  S.$: States.Format('appeals/{}/appeal_letter.pdf', $.claimId)
                createdAt:
                  S.$: $$.State.EnteredTime
            ResultPath: $.outcomeRecord
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.outcomeError
                Next: SaveDenialAnalysis
            Next: SaveDenialAnalysis

          SaveDenialAnalysis:
            Type: Task
            Resource: arn:aws:states:::dynamodb:putItem
            Parameters:
              TableName:
                Fn::ImportValue: !Sub '${DataStackName}-DenialAnalysisTable'
              Item:
                claimId:
                  S.$: $.claimId
                analysisId:
                  S.$: States.Format('ANA-{}', $.claimId)
                patientId:
                  S.$: $.patientId
                analysisJson:
                  S.$: $.analysis
                appealLetterKey:
                  S.$: States.Format('appeals/{}/appeal_letter.pdf', $.claimId)
                status:
                  S: COMPLETED
                createdAt:
                  S.$: $$.State.EnteredTime
            ResultPath: $.denialAnalysisRecord
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.denialAnalysisError
                Next: AddToPriorityQueue
            Next: AddToPriorityQueue

          AddToPriorityQueue:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt PriorityQueueFunction.Arn
              Payload:
                claimId.$: $.claimId
                patientId.$: $.patientId
                analysis.$: $.analysis
                sourceDocument.$: $.key
                timestamp.$: $$.State.EnteredTime
            ResultPath: $.priorityResult
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.priorityError
                Next: PipelineComplete
            Next: PipelineComplete

          PipelineComplete:
            Type: Succeed

          # ?? Fallback: single file processing if listing fails ?????????????????
          FallbackSingleFile:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt InvokeAgentFunction.Arn
              Payload:
                claimId.$: $.claimId
                patientId.$: $.patientId
                bucket.$: $.bucket
                sourceKey.$: $.key
                extractedText: ''
                medicalEntities: {}
                action: analyze
            ResultPath: $.agentAnalysis
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.fallbackError
                Next: PipelineComplete
            Next: PipelineComplete

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment


# =============================================================================
# OUTPUTS
# =============================================================================
Outputs:
  StateMachineArn:
    Description: ARN of the Step Functions state machine (single claim)
    Value: !Ref DenialProcessingStateMachine
    Export:
      Name: !Sub '${AWS::StackName}-StateMachine'

  FullPipelineStateMachineArn:
    Description: ARN of the Full Pipeline state machine (all files async Textract)
    Value: !Ref FullPipelineStateMachine
    Export:
      Name: !Sub '${AWS::StackName}-FullPipelineStateMachine'

  BatchStateMachineArn:
    Description: ARN of the Batch Processing state machine
    Value: !Ref BatchProcessingStateMachine
    Export:
      Name: !Sub '${AWS::StackName}-BatchStateMachine'

  S3TriggerFunctionArn:
    Description: ARN of the S3 trigger Lambda function
    Value: !GetAtt S3TriggerFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-S3TriggerFunction'

  InvokeAgentFunctionArn:
    Description: ARN of the Invoke Agent Lambda function
    Value: !GetAtt InvokeAgentFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-InvokeAgentFunction'

  ListBatchFilesFunctionArn:
    Description: ARN of the List Batch Files Lambda function
    Value: !GetAtt ListBatchFilesFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ListBatchFilesFunction'

  # SQS Batch Processing Outputs
  SQSProcessorFunctionArn:
    Description: ARN of the SQS Processor Lambda function
    Value: !GetAtt SQSProcessorFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-SQSProcessorFunction'

  EnqueueClaimsFunctionArn:
    Description: ARN of the Enqueue Claims Lambda function
    Value: !GetAtt EnqueueClaimsFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-EnqueueClaimsFunction'

  WorkflowDescription:
    Description: Step Functions workflows
    Value: |
      === PROCESSING MODES ===
      
      1. REAL-TIME (Event-Driven):
         - Triggered automatically when file uploaded to S3 intake/
         - Processes one claim per execution immediately
         - Best for: Single claim uploads, urgent processing
      
      2. SQS BATCH (Rate-Limited):
         - Enqueue claims: aws lambda invoke --function-name <EnqueueClaimsFunction> --payload '{"prefix":"intake/","maxFiles":100}'
         - Automatic rate limiting via SQS visibility timeout
         - Automatic retries (3x) with Dead Letter Queue
         - Best for: Large batch uploads, controlled processing rate
      
      3. HIGH PRIORITY SQS:
         - Enqueue: aws lambda invoke --function-name <EnqueueClaimsFunction> --payload '{"prefix":"intake/","highPriority":true}'
         - Processes immediately (no batching delay)
         - More retries (5x) before DLQ
         - Best for: Claims with approaching appeal deadlines
      
      4. MAP STATE BATCH (Parallel):
         - Start: aws stepfunctions start-execution --state-machine-arn <BatchStateMachineArn> --input '{"prefix":"intake/","maxFiles":100}'
         - Processes multiple claims in parallel (MaxConcurrency: 5)
         - Generates batch summary report
         - Best for: Scheduled batch processing, reporting
      
      === ARCHITECTURE ===
      S3 Upload ? SQS Queue ? Lambda ? Step Functions ? Textract ? Comprehend Medical ? Bedrock Agent ? DynamoDB/S3

