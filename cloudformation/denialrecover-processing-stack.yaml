AWSTemplateFormatVersion: '2010-09-09'
Description: 'DenialRecover AI - Processing Layer (Lambda + Step Functions)'

Parameters:
  Environment:
    Type: String
    Default: dev
  ProjectName:
    Type: String
    Default: denialrecover
  DataStackName:
    Type: String
    Default: denialrecover-dev
    Description: Name of the data stack to import resources from
  AgentStackName:
    Type: String
    Default: denialrecover-agent-dev
    Description: Name of the agent stack to import resources from
  BedrockAgentId:
    Type: String
    Default: ''
    Description: Bedrock Agent ID (create agent manually and provide ID here)
  BedrockAgentAliasId:
    Type: String
    Default: TSTALIASID
    Description: Bedrock Agent Alias ID (use TSTALIASID for draft version)

Conditions:
  IsProd: !Equals [!Ref Environment, 'prod']
  HasBedrockAgent: !Not [!Equals [!Ref BedrockAgentId, '']]

Resources:
  # ---------------------------------------------------------------------------
  # IAM Role for Step Functions
  # ---------------------------------------------------------------------------
  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-stepfunctions-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: '*'
              - Effect: Allow
                Action:
                  - textract:*
                  - comprehendmedical:*
                  - bedrock:InvokeModel
                Resource: '*'
              # Bedrock Agent permissions
              - Effect: Allow
                Action:
                  - bedrock:InvokeAgent
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent-alias/*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-ClaimsTableArn'
                  - !Sub 
                    - '${TableArn}/index/*'
                    - TableArn: 
                        Fn::ImportValue: !Sub '${DataStackName}-ClaimsTableArn'
                  - Fn::ImportValue: !Sub '${DataStackName}-DenialAnalysisTableArn'
                  - Fn::ImportValue: !Sub '${DataStackName}-PriorityQueueTableArn'
                  - Fn::ImportValue: !Sub '${DataStackName}-AppealOutcomesTableArn'
                  - !Sub 
                    - '${TableArn}/index/*'
                    - TableArn: 
                        Fn::ImportValue: !Sub '${DataStackName}-AppealOutcomesTableArn'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-DataBucketArn'
                  - !Sub 
                    - '${BucketArn}/*'
                    - BucketArn:
                        Fn::ImportValue: !Sub '${DataStackName}-DataBucketArn'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-KMSKey'


  # ---------------------------------------------------------------------------
  # Lambda Function - List Related Files
  # ---------------------------------------------------------------------------
  ListRelatedFilesRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-list-related-files-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ListRelatedFilesPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-DataBucketArn'
                  - !Sub
                    - '${BucketArn}/*'
                    - BucketArn:
                        Fn::ImportValue: !Sub '${DataStackName}-DataBucketArn'

  ListRelatedFilesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-list-related-files'
      Description: Lists all related files (EOBs, medical records, prior auths) for a claim
      Runtime: python3.11
      Handler: index.handler
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt ListRelatedFilesRole.Arn
      Code:
        ZipFile: |
          import os, json, boto3, re, logging
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          s3 = boto3.client('s3')

          def handler(event, context):
              claim_id = event.get('claimId', '')
              patient_id = event.get('patientId', '')
              bucket = event.get('bucket', '')
              claim_key = event.get('key', '')
              files = [{'bucket': bucket, 'key': claim_key, 'docType': 'CLAIM', 'claimId': claim_id}]
              search_paths = [('intake/eobs/', 'EOB'), ('intake/medical-records/', 'MEDICAL_RECORD'), ('intake/prior-auths/', 'PRIOR_AUTH')]
              for prefix, doc_type in search_paths:
                  try:
                      search_prefix = None
                      paginator = s3.get_paginator('list_objects_v2')
                      for page in paginator.paginate(Bucket=bucket, Prefix=prefix, Delimiter='/'):
                          for cp in page.get('CommonPrefixes', []):
                              folder = cp['Prefix']
                              folder_name = folder.rstrip('/').split('/')[-1]
                              if patient_id and folder_name.startswith(patient_id + '_'):
                                  search_prefix = folder
                                  break
                          if search_prefix:
                              break
                      if not search_prefix:
                          logger.info(f"No patient folder found for {patient_id} in {prefix}")
                          continue
                      for page in paginator.paginate(Bucket=bucket, Prefix=search_prefix):
                          for obj in page.get('Contents', []):
                              key = obj['Key']
                              filename = key.split('/')[-1]
                              if not key.endswith('.pdf'):
                                  continue
                              other_claim = re.search(r'CLM\d+', filename)
                              if claim_id in filename or not other_claim:
                                  files.append({'bucket': bucket, 'key': key, 'docType': doc_type, 'claimId': claim_id})
                                  logger.info(f"Found {doc_type}: {key}")
                  except Exception as e:
                      logger.warning(f"Error listing {doc_type}: {e}")
              logger.info(f"Total files for {claim_id}: {len(files)}")
              return {'claimId': claim_id, 'patientId': patient_id, 'bucket': bucket, 'claimKey': claim_key, 'files': files, 'fileCount': len(files)}
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ListRelatedFilesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ListRelatedFilesFunction}'
      RetentionInDays: 30

  # ---------------------------------------------------------------------------
  # Lambda Function - Merge Textract Results + Comprehend Medical
  # ---------------------------------------------------------------------------
  MergeTextractResultsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-merge-textract-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MergeTextractPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - comprehendmedical:DetectEntitiesV2
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:PutObject
                Resource:
                  - !Sub
                    - '${BucketArn}/*'
                    - BucketArn:
                        Fn::ImportValue: !Sub '${DataStackName}-DataBucketArn'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-KMSKey'

  MergeTextractResultsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-merge-textract-results'
      Description: Merges Textract results and runs Comprehend Medical on all files
      Runtime: python3.11
      Handler: index.handler
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt MergeTextractResultsRole.Arn
      Code:
        ZipFile: |
          import os, json, boto3, logging
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          comprehend = boto3.client('comprehendmedical')
          s3 = boto3.client('s3')

          def extract_lines(blocks):
              if isinstance(blocks, str):
                  try: blocks = json.loads(blocks)
                  except: return blocks
              if isinstance(blocks, list):
                  lines = [b.get('Text','') for b in blocks if b.get('BlockType')=='LINE' and b.get('Text')]
                  return ' '.join(lines)
              return str(blocks)

          def run_comprehend(text):
              entities = {'diagnoses':[],'procedures':[],'medications':[],'anatomy':[],'testResults':[]}
              try:
                  chunk = text[:19000]
                  if not chunk.strip(): return entities
                  resp = comprehend.detect_entities_v2(Text=chunk)
                  for e in resp.get('Entities',[]):
                      cat = e.get('Category',''); etype = e.get('Type',''); etext = e.get('Text',''); score = e.get('Score',0)
                      if score < 0.7: continue
                      if cat == 'MEDICAL_CONDITION': entities['diagnoses'].append(etext)
                      elif cat in ['PROCEDURE','TEST_TREATMENT_PROCEDURE']: entities['procedures'].append(etext)
                      elif cat == 'MEDICATION': entities['medications'].append(etext)
                      elif cat == 'ANATOMY': entities['anatomy'].append(etext)
                      elif etype in ['TEST_NAME','TEST_VALUE']: entities['testResults'].append(etext)
                  for k in entities: entities[k] = list(dict.fromkeys(entities[k]))
              except Exception as e:
                  logger.warning(f"Comprehend error: {e}")
              return entities

          def handler(event, context):
              file_results = event.get('fileResults', [])
              claim_id = event.get('claimId',''); patient_id = event.get('patientId','')
              bucket = event.get('bucket',''); claim_key = event.get('claimKey','')
              merged = {'claimId':claim_id,'patientId':patient_id,'bucket':bucket,'claimKey':claim_key,
                        'claimText':'','claimEntities':{},'relatedDocs':{'eob':[],'medical_record':[],'prior_auth':[]},
                        'allEntities':{'diagnoses':[],'procedures':[],'medications':[],'anatomy':[],'testResults':[]}}
              for result in file_results:
                  doc_type = result.get('docType','UNKNOWN'); key = result.get('key','')
                  textract_s3_key = result.get('textractS3Key', '')
                  
                  # Read Textract blocks from S3
                  blocks = []
                  if textract_s3_key and bucket:
                      try:
                          resp = s3.get_object(Bucket=bucket, Key=textract_s3_key)
                          blocks = json.loads(resp['Body'].read().decode('utf-8'))
                          # Clean up temp file
                          try: s3.delete_object(Bucket=bucket, Key=textract_s3_key)
                          except: pass
                      except Exception as e:
                          logger.warning(f"Error reading Textract results from S3: {e}")
                  
                  text = extract_lines(blocks)
                  entities = run_comprehend(text) if text else {}
                  doc_entry = {'key':key,'text':text[:2000],'entities':entities}
                  if doc_type == 'CLAIM':
                      merged['claimText'] = text; merged['claimEntities'] = entities
                  elif doc_type == 'EOB': merged['relatedDocs']['eob'].append(doc_entry)
                  elif doc_type == 'MEDICAL_RECORD': merged['relatedDocs']['medical_record'].append(doc_entry)
                  elif doc_type == 'PRIOR_AUTH': merged['relatedDocs']['prior_auth'].append(doc_entry)
                  for k in merged['allEntities']: merged['allEntities'][k].extend(entities.get(k,[]))
              for k in merged['allEntities']: merged['allEntities'][k] = list(dict.fromkeys(merged['allEntities'][k]))
              logger.info(f"Merged {len(file_results)} files. Entities: {sum(len(v) for v in merged['allEntities'].values())}")
              return merged
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  MergeTextractResultsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${MergeTextractResultsFunction}'
      RetentionInDays: 30

  # ---------------------------------------------------------------------------
  # Lambda Function - Invoke Bedrock Agent
  # ---------------------------------------------------------------------------
  InvokeAgentLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-invoke-agent-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InvokeAgentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeAgent
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent-alias/*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'
                  - !Sub 'arn:aws:bedrock:us-east-1::foundation-model/*'
                  - !Sub 'arn:aws:bedrock:us-west-2::foundation-model/*'
                  - !Sub 'arn:aws:bedrock:eu-west-1::foundation-model/*'
              - Effect: Allow
                Action:
                  - aoss:APIAccessAll
                Resource: !Sub 'arn:aws:aoss:${AWS::Region}:${AWS::AccountId}:collection/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-DataBucketArn'
                  - !Sub 
                    - '${BucketArn}/*'
                    - BucketArn:
                        Fn::ImportValue: !Sub '${DataStackName}-DataBucketArn'
              - Effect: Allow
                Action:
                  - textract:DetectDocumentText
                  - textract:AnalyzeDocument
                  - comprehendmedical:DetectEntitiesV2
                Resource: '*'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-KMSKey'

  InvokeAgentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-invoke-agent'
      Description: Invokes Bedrock with RAG from OpenSearch for claim analysis and appeal generation
      Runtime: python3.11
      Handler: index.handler
      MemorySize: 512
      Timeout: 120
      Role: !GetAtt InvokeAgentLambdaRole.Arn
      Layers:
        - arn:aws:lambda:us-east-1:193786182229:layer:denialrecover-dev-opensearch-layer:1
      Environment:
        Variables:
          AGENT_ID: !Ref BedrockAgentId
          AGENT_ALIAS_ID: !Ref BedrockAgentAliasId
          DATA_BUCKET:
            Fn::ImportValue: !Sub '${DataStackName}-DataBucket'
          OPENSEARCH_ENDPOINT: !Sub 'https://e4jsoizbv1a0gtx5axh2.us-east-1.aoss.amazonaws.com'
          CLAUDE_MODEL_ID: us.anthropic.claude-sonnet-4-5-20250929-v1:0
          EMBEDDING_MODEL_ID: amazon.titan-embed-text-v1
          LOG_LEVEL: !If [IsProd, 'INFO', 'DEBUG']
      Code:
        ZipFile: |
          import os
          import json
          import logging
          import boto3
          import uuid
          import re

          logger = logging.getLogger()
          logger.setLevel(os.environ.get('LOG_LEVEL', 'INFO'))

          bedrock_agent = boto3.client('bedrock-agent-runtime')
          textract = boto3.client('textract')
          s3 = boto3.client('s3')
          AGENT_ID = os.environ.get('AGENT_ID', '')
          AGENT_ALIAS_ID = os.environ.get('AGENT_ALIAS_ID', 'TSTALIASID')
          DATA_BUCKET = os.environ.get('DATA_BUCKET', '')

          # Denial code classifications
          DENIAL_CLASSIFICATIONS = {
              'CO-4': {'category': 'CODING_ERROR', 'description': 'Procedure code inconsistent with modifier'},
              'CO-16': {'category': 'MISSING_INFO', 'description': 'Claim lacks information needed for adjudication'},
              'CO-18': {'category': 'DUPLICATE', 'description': 'Duplicate claim/service'},
              'CO-22': {'category': 'COORDINATION', 'description': 'Payment adjusted - coordination of benefits'},
              'CO-45': {'category': 'EXCEEDS_FEE', 'description': 'Charge exceeds fee schedule'},
              'CO-50': {'category': 'NON_COVERED', 'description': 'Non-covered service'},
              'CO-97': {'category': 'BUNDLED', 'description': 'Payment included in another service'},
              'CO-167': {'category': 'MEDICAL_NECESSITY', 'description': 'Diagnosis not covered'},
              'PR-1': {'category': 'DEDUCTIBLE', 'description': 'Deductible amount'},
              'PR-2': {'category': 'COINSURANCE', 'description': 'Coinsurance amount'},
              'PR-3': {'category': 'COPAY', 'description': 'Co-payment amount'},
              'PR-96': {'category': 'NON_COVERED', 'description': 'Non-covered charge'},
              'OA-23': {'category': 'AUTH_REQUIRED', 'description': 'Prior authorization required'}
          }

          # Historical success rates by denial category
          SUCCESS_RATES = {
              'MEDICAL_NECESSITY': 72,
              'CODING_ERROR': 85,
              'MISSING_INFO': 78,
              'AUTH_REQUIRED': 65,
              'DUPLICATE': 45,
              'BUNDLED': 68,
              'NON_COVERED': 55,
              'COORDINATION': 60,
              'EXCEEDS_FEE': 50,
              'DEDUCTIBLE': 25,
              'COINSURANCE': 20,
              'COPAY': 15,
              'TIMELY_FILING': 30,
              'ELIGIBILITY': 40
          }

          def handler(event, context):
              logger.info(f"Received event: {json.dumps(event)}")
              
              claim_id = event.get('claimId', 'unknown')
              patient_id = event.get('patientId', '')
              raw_text = event.get('extractedText', '')
              medical_entities = event.get('medicalEntities', {})
              action = event.get('action', 'analyze')
              bucket = event.get('bucket', DATA_BUCKET)
              source_key = event.get('sourceKey', event.get('key', ''))
              
              # Pre-computed related docs from full pipeline (Step Functions Map state)
              pre_computed_related = event.get('relatedDocs', None)
              pre_computed_all_entities = event.get('allEntities', None)
              
              # Clean extractedText - it may be raw Textract JSON blocks string
              extracted_text = raw_text
              if raw_text and (raw_text.strip().startswith('[') or raw_text.strip().startswith('{')):
                  try:
                      blocks = json.loads(raw_text)
                      if isinstance(blocks, list):
                          lines = [b.get('Text', '') for b in blocks if b.get('BlockType') == 'LINE' and b.get('Text')]
                          extracted_text = ' '.join(lines)
                          logger.info(f"Extracted {len(lines)} text lines from Textract blocks")
                  except Exception:
                      pass
              
              # Derive patient name from S3 folder path or patientId
              patient_name = extract_patient_name(source_key, patient_id, extracted_text)
              
              # Parse medical entities for analysis
              parsed_entities = parse_medical_entities(medical_entities)
              
              # Use pre-computed related docs from Step Functions if available
              if pre_computed_related:
                  related_docs = pre_computed_related
                  logger.info(f"Using pre-computed related docs: {sum(len(v) for v in related_docs.values())} files")
              else:
                  related_docs = fetch_related_documents(bucket, claim_id, patient_id)
              
              # Extract claim details - supplement with EOB text for better denial code extraction
              eob_supplement = ''
              for eob in related_docs.get('eob', []):
                  eob_supplement += ' ' + eob.get('text', '')
              claim_details = extract_claim_details(extracted_text + ' ' + eob_supplement)
              claim_details['patientName'] = patient_name
              claim_details['patientId'] = patient_id
              
              # Merge all entities from related docs if pre-computed
              if pre_computed_all_entities:
                  for k in ['diagnoses', 'procedures', 'medications']:
                      existing = [e.get('text', e) if isinstance(e, dict) else e for e in parsed_entities.get(k, [])]
                      new_entities = pre_computed_all_entities.get(k, [])
                      combined = list(dict.fromkeys(existing + new_entities))
                      parsed_entities[k] = [{'text': e, 'type': k, 'score': 0.9} for e in combined]
              
              if action == 'analyze':
                  prompt = build_analysis_prompt(claim_id, extracted_text, medical_entities, parsed_entities, claim_details, related_docs)
              else:
                  analysis = event.get('analysis', {})
                  if isinstance(analysis, dict):
                      analysis['patientName'] = patient_name
                      analysis['patientId'] = patient_id
                  prompt = build_appeal_prompt(claim_id, extracted_text, medical_entities, analysis, parsed_entities, related_docs, patient_name_override=patient_name, patient_id_override=patient_id, claim_details=claim_details)
              
              if not AGENT_ID:
                  logger.warning("No Bedrock Agent configured, using direct Claude + OpenSearch RAG")
              
              try:
                  result_text = invoke_claude_with_rag(prompt, claim_details)
                  logger.info(f"Claude response: {result_text[:500]}...")
                  return {
                      'statusCode': 200,
                      'action': action,
                      'claimId': claim_id,
                      'agentResponse': result_text,
                      'parsedEntities': parsed_entities,
                      'claimDetails': claim_details
                  }
              except Exception as e:
                  logger.error(f"Error invoking agent: {str(e)}")
                  return fallback_response(action, claim_id, parsed_entities, claim_details)

          def invoke_claude_with_rag(prompt, claim_details):
              """Invoke Claude directly with RAG context from OpenSearch payer policies."""
              bedrock_runtime = boto3.client('bedrock-runtime', region_name=os.environ.get('AWS_REGION', 'us-east-1'))
              CLAUDE_MODEL = os.environ.get('CLAUDE_MODEL_ID', 'us.anthropic.claude-sonnet-4-5-20250929-v1:0')
              OPENSEARCH_ENDPOINT = os.environ.get('OPENSEARCH_ENDPOINT', '')
              
              # Step 1: Retrieve relevant payer policies from OpenSearch (RAG)
              rag_context = ''
              if OPENSEARCH_ENDPOINT:
                  try:
                      rag_context = retrieve_payer_policies(claim_details, OPENSEARCH_ENDPOINT)
                      if rag_context:
                          logger.info(f"RAG: Retrieved {len(rag_context)} chars of payer policy context")
                  except Exception as e:
                      logger.warning(f"RAG retrieval failed: {e}")
              
              # Step 2: Augment prompt with retrieved policies
              if rag_context:
                  augmented_prompt = prompt + f"\n\n=== RETRIEVED PAYER POLICIES (from knowledge base) ===\n{rag_context}\n"
              else:
                  augmented_prompt = prompt
              
              # Step 3: Call Claude
              body = json.dumps({
                  'anthropic_version': 'bedrock-2023-05-31',
                  'max_tokens': 4096,
                  'messages': [
                      {'role': 'user', 'content': augmented_prompt}
                  ]
              })
              
              response = bedrock_runtime.invoke_model(
                  modelId=CLAUDE_MODEL,
                  contentType='application/json',
                  accept='application/json',
                  body=body
              )
              
              result = json.loads(response['body'].read())
              raw = result['content'][0]['text']
              # Strip markdown code fences if Claude wraps response in ```json ... ```
              clean = raw.strip()
              if clean.startswith('```'):
                  lines = clean.split('\n')
                  clean = '\n'.join(lines[1:-1] if lines[-1].strip() == '```' else lines[1:])
              return clean

          def retrieve_payer_policies(claim_details, opensearch_endpoint):
              """Query OpenSearch for relevant payer policies using semantic search."""
              try:
                  from opensearchpy import OpenSearch, RequestsHttpConnection
                  from requests_aws4auth import AWS4Auth
                  
                  region = os.environ.get('AWS_REGION', 'us-east-1')
                  credentials = boto3.Session().get_credentials()
                  awsauth = AWS4Auth(
                      credentials.access_key,
                      credentials.secret_key,
                      region,
                      'aoss',
                      session_token=credentials.token
                  )
                  
                  host = opensearch_endpoint.replace('https://', '')
                  client = OpenSearch(
                      hosts=[{'host': host, 'port': 443}],
                      http_auth=awsauth,
                      use_ssl=True,
                      verify_certs=True,
                      connection_class=RequestsHttpConnection,
                      timeout=15
                  )
                  
                  # Build search query from claim details
                  payer = claim_details.get('payer', '')
                  denial_code = claim_details.get('denialCode', '')
                  cpt_codes = ' '.join(claim_details.get('cptCodes', []))
                  denial_category = claim_details.get('denialCategory', '')
                  
                  query_text = f"{payer} {denial_code} {denial_category} {cpt_codes} appeal policy coverage"
                  
                  # Generate embedding for semantic search
                  bedrock_runtime = boto3.client('bedrock-runtime', region_name=region)
                  embed_response = bedrock_runtime.invoke_model(
                      modelId=os.environ.get('EMBEDDING_MODEL_ID', 'amazon.titan-embed-text-v1'),
                      contentType='application/json',
                      accept='application/json',
                      body=json.dumps({'inputText': query_text[:8000]})
                  )
                  embedding = json.loads(embed_response['body'].read())['embedding']
                  
                  # Search payer-policies index
                  search_body = {
                      'size': 5,
                      'query': {
                          'knn': {
                              'content_vector': {
                                  'vector': embedding,
                                  'k': 5
                              }
                          }
                      },
                      '_source': {'excludes': ['content_vector']}
                  }
                  
                  # Also try keyword search for payer-specific policies
                  if payer:
                      search_body['query'] = {
                          'bool': {
                              'should': [
                                  {'knn': {'content_vector': {'vector': embedding, 'k': 5}}},
                                  {'term': {'payer_id': payer.upper()}}
                              ]
                          }
                      }
                  
                  response = client.search(index='payer-policies', body=search_body)
                  hits = response.get('hits', {}).get('hits', [])
                  
                  if not hits:
                      return ''
                  
                  # Format retrieved policies
                  policy_texts = []
                  for hit in hits:
                      src = hit['_source']
                      payer_id = src.get('payer_id', 'Unknown')
                      doc_name = src.get('document_name', '')
                      content = src.get('content_text', '')[:1000]
                      score = hit.get('_score', 0)
                      policy_texts.append(f"[{payer_id} - {doc_name} (relevance: {score:.2f})]\n{content}")
                  
                  return '\n\n'.join(policy_texts)
                  
              except Exception as e:
                  logger.warning(f"OpenSearch policy retrieval error: {e}")
                  return ''

          def extract_patient_name(source_key, patient_id, text):
              """Extract patient name from S3 path, patientId, or document text."""
              # Method 1: Parse from S3 folder path
              # e.g., intake/claims/PAT001_john_smith/denied_claim_CLM001.pdf ? John Smith
              if source_key:
                  parts = source_key.split('/')
                  for part in parts:
                      if patient_id and part.startswith(patient_id + '_'):
                          name_part = part[len(patient_id) + 1:]  # remove PAT001_
                          name = name_part.replace('_', ' ').title()
                          if name:
                              return name
              
              # Method 2: Try to find name in document text
              if text:
                  text_str = str(text)
                  # Look for "Patient: John Smith" or "Patient Name: John Smith"
                  name_match = re.search(
                      r'(?:Patient(?:\s+Name)?|Member(?:\s+Name)?)[:\s]+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)+)',
                      text_str
                  )
                  if name_match:
                      return name_match.group(1)
              
              # Method 3: Fallback to patientId
              return patient_id or 'Unknown Patient'

          def fetch_related_documents(bucket, claim_id, patient_id=None):
              """Fetch, extract text (Textract), and extract medical entities (Comprehend Medical)
              from EOBs, medical records, and prior auths related to this claim."""
              related = {'eob': [], 'medical_record': [], 'prior_auth': []}
              comprehend_medical = boto3.client('comprehendmedical', region_name=os.environ.get('AWS_REGION', 'us-east-1'))
              
              if not bucket:
                  return related
              
              search_paths = [
                  ('intake/eobs/', 'eob'),
                  ('intake/medical-records/', 'medical_record'),
                  ('intake/prior-auths/', 'prior_auth'),
              ]
              
              for prefix, doc_type in search_paths:
                  try:
                      search_prefix = prefix
                      if patient_id:
                          paginator = s3.get_paginator('list_objects_v2')
                          for page in paginator.paginate(Bucket=bucket, Prefix=prefix, Delimiter='/'):
                              for cp in page.get('CommonPrefixes', []):
                                  folder = cp['Prefix']
                                  folder_name = folder.rstrip('/').split('/')[-1]
                                  if folder_name.startswith(patient_id):
                                      search_prefix = folder
                                      break
                      
                      paginator = s3.get_paginator('list_objects_v2')
                      for page in paginator.paginate(Bucket=bucket, Prefix=search_prefix):
                          for obj in page.get('Contents', []):
                              key = obj['Key']
                              filename = key.split('/')[-1]
                              
                              if not (key.endswith('.pdf') or key.endswith('.json')):
                                  continue
                              
                              include = False
                              text_limit = 2000
                              
                              if claim_id in filename:
                                  include = True
                              elif patient_id and patient_id in key and claim_id not in filename:
                                  other_claim = re.search(r'CLM\d+', filename)
                                  if not other_claim:
                                      include = True
                                      text_limit = 1500
                              
                              if include:
                                  text = extract_text_from_s3_file(bucket, key)
                                  if text:
                                      # Run Comprehend Medical on extracted text
                                      entities = extract_medical_entities_from_text(
                                          comprehend_medical, text, key
                                      )
                                      
                                      related[doc_type].append({
                                          'key': key,
                                          'text': text[:text_limit],
                                          'entities': entities,
                                          'match': 'claim_id' if claim_id in filename else 'patient_folder'
                                      })
                                      logger.info(f"Processed {doc_type}: {key} - entities: {len(entities.get('diagnoses',[]))} dx, {len(entities.get('procedures',[]))} proc")
                                          
                  except Exception as e:
                      logger.warning(f"Error fetching {doc_type} for {claim_id}: {str(e)}")
              
              return related

          def extract_medical_entities_from_text(comprehend_medical, text, source_key=''):
              """Run Comprehend Medical on text and return structured entities."""
              entities = {'diagnoses': [], 'procedures': [], 'medications': [], 'anatomy': [], 'testResults': []}
              try:
                  # Comprehend Medical has 20KB limit per request
                  text_chunk = text[:19000]
                  response = comprehend_medical.detect_entities_v2(Text=text_chunk)
                  
                  for entity in response.get('Entities', []):
                      category = entity.get('Category', '')
                      entity_type = entity.get('Type', '')
                      entity_text = entity.get('Text', '')
                      score = entity.get('Score', 0)
                      
                      if score < 0.7:
                          continue
                      
                      if category == 'MEDICAL_CONDITION':
                          entities['diagnoses'].append(entity_text)
                      elif category in ['PROCEDURE', 'TEST_TREATMENT_PROCEDURE']:
                          entities['procedures'].append(entity_text)
                      elif category == 'MEDICATION':
                          entities['medications'].append(entity_text)
                      elif category == 'ANATOMY':
                          entities['anatomy'].append(entity_text)
                      elif entity_type in ['TEST_NAME', 'TEST_VALUE', 'TEST_UNIT']:
                          entities['testResults'].append(entity_text)
                  
                  # Deduplicate
                  for k in entities:
                      entities[k] = list(dict.fromkeys(entities[k]))
                      
              except Exception as e:
                  logger.warning(f"Comprehend Medical error for {source_key}: {e}")
              
              return entities

          def extract_text_from_s3_file(bucket, key):
              """Extract text from a PDF (via Textract) or JSON file (direct read)."""
              try:
                  if key.endswith('.json'):
                      # Read JSON directly from S3
                      response = s3.get_object(Bucket=bucket, Key=key)
                      content = response['Body'].read().decode('utf-8')
                      try:
                          data = json.loads(content)
                          # Flatten JSON to readable text
                          return json.dumps(data, indent=2)[:2000]
                      except Exception:
                          return content[:2000]
                  else:
                      # Use Textract for PDFs
                      return extract_text_from_s3_pdf(bucket, key)
              except Exception as e:
                  logger.warning(f"Error reading {key}: {str(e)}")
                  return ''

          def extract_text_from_s3_pdf(bucket, key):
              """Use Textract synchronous API to extract text from a small PDF."""
              try:
                  response = textract.detect_document_text(
                      Document={'S3Object': {'Bucket': bucket, 'Name': key}}
                  )
                  lines = [b['Text'] for b in response.get('Blocks', []) if b['BlockType'] == 'LINE']
                  return ' '.join(lines)
              except Exception as e:
                  logger.warning(f"Textract error for {key}: {str(e)}")
                  return ''

          def parse_medical_entities(entities):
              """Parse Comprehend Medical entities into structured format"""
              parsed = {
                  'diagnoses': [],
                  'procedures': [],
                  'medications': [],
                  'anatomy': [],
                  'testResults': []
              }
              
              if not entities:
                  return parsed
              
              for entity in entities.get('Entities', []):
                  category = entity.get('Category', '')
                  entity_type = entity.get('Type', '')
                  text = entity.get('Text', '')
                  score = entity.get('Score', 0)
                  
                  if score < 0.7:
                      continue
                  
                  if category == 'MEDICAL_CONDITION':
                      parsed['diagnoses'].append({'text': text, 'type': entity_type, 'score': score})
                  elif category == 'PROCEDURE' or entity_type in ['PROCEDURE_NAME', 'TEST_NAME']:
                      parsed['procedures'].append({'text': text, 'type': entity_type, 'score': score})
                  elif category == 'MEDICATION':
                      parsed['medications'].append({'text': text, 'type': entity_type, 'score': score})
                  elif category == 'ANATOMY':
                      parsed['anatomy'].append({'text': text, 'type': entity_type, 'score': score})
                  elif category == 'TEST_TREATMENT_PROCEDURE':
                      parsed['testResults'].append({'text': text, 'type': entity_type, 'score': score})
              
              return parsed

          def extract_claim_details(text):
              """Extract claim details from OCR text"""
              details = {
                  'claimAmount': 0,
                  'denialCode': '',
                  'denialCategory': 'UNKNOWN',
                  'payer': '',
                  'dateOfService': '',
                  'cptCodes': [],
                  'icdCodes': []
              }
              
              if not text:
                  return details
              
              text_str = str(text)
              
              # Extract dollar amounts
              amounts = re.findall(r'\$[\d,]+\.?\d*', text_str)
              if amounts:
                  details['claimAmount'] = float(amounts[0].replace('$', '').replace(',', ''))
              
              # Extract denial codes (CO-XX, PR-XX, OA-XX format)
              denial_codes = re.findall(r'(CO-\d+|PR-\d+|OA-\d+)', text_str)
              if denial_codes:
                  details['denialCode'] = denial_codes[0]
                  if denial_codes[0] in DENIAL_CLASSIFICATIONS:
                      details['denialCategory'] = DENIAL_CLASSIFICATIONS[denial_codes[0]]['category']
              
              # Also check for CARC codes (just numbers) and map to categories
              if not details['denialCode']:
                  # CARC code mappings
                  carc_mappings = {
                      '4': ('CO-4', 'CODING_ERROR'),
                      '16': ('CO-16', 'MISSING_INFO'),
                      '18': ('CO-18', 'DUPLICATE'),
                      '27': ('CO-27', 'NON_COVERED'),
                      '29': ('CO-29', 'TIMELY_FILING'),
                      '45': ('CO-45', 'EXCEEDS_FEE'),
                      '50': ('CO-50', 'MEDICAL_NECESSITY'),
                      '97': ('CO-97', 'BUNDLED'),
                      '167': ('CO-167', 'MEDICAL_NECESSITY'),
                      '197': ('CO-197', 'AUTH_REQUIRED'),
                  }
                  # Look for CARC patterns like "CARC: 50" or "Reason Code: 50"
                  carc_match = re.search(r'(?:CARC|Reason\s*Code|Adjustment\s*Code)[:\s]*(\d+)', text_str, re.I)
                  if carc_match:
                      carc_num = carc_match.group(1)
                      if carc_num in carc_mappings:
                          details['denialCode'], details['denialCategory'] = carc_mappings[carc_num]
              
              # Also look for denial category keywords in text
              if details['denialCategory'] == 'UNKNOWN':
                  category_keywords = {
                      'MEDICAL_NECESSITY': ['medical necessity', 'not medically necessary', 'not deemed medically necessary'],
                      'AUTH_REQUIRED': ['prior authorization', 'precertification', 'authorization absent', 'auth required'],
                      'CODING_ERROR': ['coding error', 'procedure code inconsistent', 'modifier', 'invalid code'],
                      'MISSING_INFO': ['missing information', 'lacks information', 'incomplete', 'missing documentation'],
                      'DUPLICATE': ['duplicate claim', 'duplicate service', 'already processed'],
                      'BUNDLED': ['bundled', 'included in', 'payment adjusted'],
                      'TIMELY_FILING': ['timely filing', 'filing deadline', 'time limit expired'],
                      'NON_COVERED': ['non-covered', 'not covered', 'coverage terminated', 'not eligible'],
                  }
                  text_lower = text_str.lower()
                  for category, keywords in category_keywords.items():
                      if any(kw in text_lower for kw in keywords):
                          details['denialCategory'] = category
                          break
              
              # Extract CPT codes
              cpt_codes = re.findall(r'\b(\d{5})\b', text_str)
              details['cptCodes'] = list(set(cpt_codes))[:5]
              
              # Extract ICD-10 codes
              icd_codes = re.findall(r'\b([A-Z]\d{2}\.?\d*)\b', text_str)
              details['icdCodes'] = list(set(icd_codes))[:5]
              
              # Extract payer names
              payers = ['Aetna', 'UnitedHealthcare', 'Cigna', 'Blue Cross', 'Humana', 'Anthem', 'Kaiser', 'Medicare', 'Medicaid']
              for payer in payers:
                  if payer.lower() in text_str.lower():
                      details['payer'] = payer
                      break
              
              return details

          def calculate_recovery_score(claim_details, parsed_entities):
              """Calculate recovery opportunity score based on claim value and success probability"""
              claim_amount = claim_details.get('claimAmount', 0)
              denial_category = claim_details.get('denialCategory', 'UNKNOWN')
              
              # Base success rate from historical data
              base_success_rate = SUCCESS_RATES.get(denial_category, 50)
              
              # Adjust based on medical evidence strength
              evidence_bonus = 0
              if len(parsed_entities.get('diagnoses', [])) >= 2:
                  evidence_bonus += 5
              if len(parsed_entities.get('procedures', [])) >= 1:
                  evidence_bonus += 5
              if len(parsed_entities.get('testResults', [])) >= 1:
                  evidence_bonus += 5
              
              success_probability = min(95, base_success_rate + evidence_bonus)
              
              # Calculate expected recovery
              expected_recovery = claim_amount * (success_probability / 100)
              
              # Priority score (1-10) based on recovery opportunity
              if expected_recovery >= 5000:
                  priority_score = 10
              elif expected_recovery >= 2000:
                  priority_score = 8
              elif expected_recovery >= 1000:
                  priority_score = 6
              elif expected_recovery >= 500:
                  priority_score = 4
              else:
                  priority_score = 2
              
              return {
                  'successProbability': success_probability,
                  'expectedRecovery': round(expected_recovery, 2),
                  'priorityScore': priority_score,
                  'dollarImpact': claim_amount,
                  'recoveryOpportunity': 'HIGH' if expected_recovery >= 2000 else 'MEDIUM' if expected_recovery >= 500 else 'LOW'
              }

          def build_analysis_prompt(claim_id, text, entities, parsed_entities, claim_details, related_docs=None):
              recovery = calculate_recovery_score(claim_details, parsed_entities)
              
              # Build related documents section
              related_section = ''
              if related_docs:
                  eobs = related_docs.get('eob', [])
                  med_recs = related_docs.get('medical_record', [])
                  prior_auths = related_docs.get('prior_auth', [])
                  
                  def format_doc_section(docs, title):
                      if not docs:
                          return ''
                      section = f'\n=== {title} ===\n'
                      for doc in docs:
                          fname = doc['key'].split('/')[-1]
                          section += f"File: {fname}\n"
                          # Include Comprehend Medical entities if available
                          entities = doc.get('entities', {})
                          if entities.get('diagnoses'):
                              section += f"  Diagnoses: {', '.join(entities['diagnoses'][:5])}\n"
                          if entities.get('procedures'):
                              section += f"  Procedures: {', '.join(entities['procedures'][:5])}\n"
                          if entities.get('medications'):
                              section += f"  Medications: {', '.join(entities['medications'][:5])}\n"
                          if entities.get('testResults'):
                              section += f"  Test Results: {', '.join(entities['testResults'][:5])}\n"
                          section += f"  Text: {doc['text']}\n\n"
                      return section
                  
                  related_section += format_doc_section(eobs, 'EXPLANATION OF BENEFITS (EOB)')
                  related_section += format_doc_section(med_recs, 'MEDICAL RECORDS')
                  related_section += format_doc_section(prior_auths, 'PRIOR AUTHORIZATION DOCUMENTS')
              
              return f"""You are a medical claim denial recovery specialist. Analyze this denied claim using the medical entities extracted by Amazon Comprehend Medical and search the payer policy knowledge base for relevant coverage rules.

          === CLAIM INFORMATION ===
          Claim ID: {claim_id}
          Patient Name: {claim_details.get('patientName', 'Unknown')}
          Patient ID: {claim_details.get('patientId', '')}
          Payer: {claim_details.get('payer', 'Unknown')}
          Claim Amount: ${claim_details.get('claimAmount', 0):,.2f}
          Denial Code: {claim_details.get('denialCode', 'Unknown')}
          Denial Category: {claim_details.get('denialCategory', 'Unknown')}
          CPT Codes: {', '.join(claim_details.get('cptCodes', []))}
          ICD-10 Codes: {', '.join(claim_details.get('icdCodes', []))}

          === MEDICAL ENTITIES (from Comprehend Medical) ===
          Diagnoses: {json.dumps([d['text'] for d in parsed_entities.get('diagnoses', [])], indent=2)}
          Procedures: {json.dumps([p['text'] for p in parsed_entities.get('procedures', [])], indent=2)}
          Medications: {json.dumps([m['text'] for m in parsed_entities.get('medications', [])], indent=2)}
          Anatomy: {json.dumps([a['text'] for a in parsed_entities.get('anatomy', [])], indent=2)}
          Test Results: {json.dumps([t['text'] for t in parsed_entities.get('testResults', [])], indent=2)}

          === PRELIMINARY SCORING ===
          Success Probability: {recovery['successProbability']}%
          Expected Recovery: ${recovery['expectedRecovery']:,.2f}
          Priority Score: {recovery['priorityScore']}/10
          Recovery Opportunity: {recovery['recoveryOpportunity']}

          === EXTRACTED CLAIM DOCUMENT TEXT ===
          {str(text)[:2500]}
          {related_section}
          === ANALYSIS INSTRUCTIONS ===
          CRITICAL: Base ALL findings ONLY on the extracted text and entities provided above.
          Do NOT invent, assume, or hallucinate any patient names, dates, member IDs, 
          clinical details, payer policies, or dollar amounts not present in the data above.
          If a field cannot be determined from the provided data, use null or "Unknown".

          1. SEARCH PAYER POLICIES: Query the knowledge base for {claim_details.get('payer', 'payer')} policies related to:
             - CPT codes: {', '.join(claim_details.get('cptCodes', []))}
             - Denial code: {claim_details.get('denialCode', '')}
             - Medical necessity criteria for the diagnoses listed
             - Only cite policies that were actually retrieved ? do not fabricate policy references

          2. CLASSIFY DENIAL REASON: Based ONLY on the denial code and extracted text above:
             - MEDICAL_NECESSITY: Service not medically necessary
             - CODING_ERROR: Incorrect or mismatched codes
             - MISSING_INFO: Missing documentation or information
             - AUTH_REQUIRED: Prior authorization not obtained
             - NON_COVERED: Service not covered by plan
             - DUPLICATE: Duplicate claim submission
             - BUNDLED: Service bundled with another code

          3. CALCULATE APPEAL PROBABILITY: Base this on:
             - The actual denial code provided (not assumed)
             - Medical entities actually extracted by Comprehend Medical
             - Supporting documents actually found (EOB, medical records, prior auth)
             - Do NOT assume documentation exists if not shown above

          4. IDENTIFY MISSING DOCUMENTATION: Only list documents that are genuinely absent
             based on the denial reason and what was NOT found in the related files above.

          5. SCORE RECOVERY OPPORTUNITY: Use only the actual claim amount extracted above.

          === REQUIRED JSON RESPONSE ===
          Provide your analysis as a JSON object. Use ONLY data from the sections above.
          If a value cannot be determined from the provided data, use null.
          {{
              "denialReason": "Primary denial classification based on extracted denial code",
              "denialReasonDetail": "Specific explanation based ONLY on extracted text",
              "successProbability": 0-100,
              "appealStrategy": "Recommended approach based on denial type and available evidence",
              "priorityScore": 1-10,
              "dollarImpact": {claim_details.get('claimAmount', 0)},
              "expectedRecovery": calculated from actual claim amount above,
              "recoveryOpportunity": "HIGH/MEDIUM/LOW",
              "keyFindings": ["findings based ONLY on extracted data"],
              "medicalNecessityEvidence": ["evidence from Comprehend Medical entities above"],
              "missingDocumentation": ["documents absent based on denial reason"],
              "relevantPolicies": ["policies from retrieved knowledge base only"],
              "appealDeadline": null,
              "recommendedActions": ["actions based on denial type and available evidence"]
          }}"""

          def build_appeal_prompt(claim_id, text, entities, analysis, parsed_entities, related_docs=None, patient_name_override=None, patient_id_override=None, claim_details=None):
              # Extract patient name from analysis if available, or use override from handler
              patient_name = patient_name_override or 'Unknown Patient'
              patient_id = patient_id_override or ''
              if isinstance(analysis, dict):
                  if not patient_name_override:
                      patient_name = analysis.get('patientName', patient_name)
                  if not patient_id_override:
                      patient_id = analysis.get('patientId', patient_id)
              if not claim_details:
                  claim_details = {}
              
              # Build related documents section for appeal context
              related_section = ''
              if related_docs:
                  eobs = related_docs.get('eob', [])
                  med_recs = related_docs.get('medical_record', [])
                  prior_auths = related_docs.get('prior_auth', [])
                  
                  def format_doc_section(docs, title):
                      if not docs:
                          return ''
                      section = f'\n=== {title} ===\n'
                      for doc in docs:
                          fname = doc['key'].split('/')[-1]
                          section += f"File: {fname}\n"
                          entities = doc.get('entities', {})
                          if entities.get('diagnoses'):
                              section += f"  Diagnoses: {', '.join(entities['diagnoses'][:5])}\n"
                          if entities.get('procedures'):
                              section += f"  Procedures: {', '.join(entities['procedures'][:5])}\n"
                          if entities.get('medications'):
                              section += f"  Medications: {', '.join(entities['medications'][:5])}\n"
                          if entities.get('testResults'):
                              section += f"  Test Results: {', '.join(entities['testResults'][:5])}\n"
                          section += f"  Text: {doc['text']}\n\n"
                      return section
                  
                  related_section += format_doc_section(eobs, 'EXPLANATION OF BENEFITS (EOB)')
                  related_section += format_doc_section(med_recs, 'MEDICAL RECORDS')
                  related_section += format_doc_section(prior_auths, 'PRIOR AUTHORIZATION DOCUMENTS')

              # Pre-compute values for f-string (avoid format spec issues)
              _payer = claim_details.get('payer', 'Unknown') if isinstance(claim_details, dict) else 'Unknown'
              _amount = claim_details.get('claimAmount', 0) if isinstance(claim_details, dict) else 0
              _amount_str = f"${_amount:,.2f}" if isinstance(_amount, (int, float)) else f"${_amount}"
              _dos = claim_details.get('dateOfService', '') if isinstance(claim_details, dict) else ''
              _denial_code = claim_details.get('denialCode', '') if isinstance(claim_details, dict) else ''

              return f"""You are a medical claim appeal specialist writing to a payer's appeals review team. Generate a clear, professional, and persuasive appeal letter that is easy for payer reviewers to process quickly.

          WRITING STYLE FOR PAYER REVIEWERS:
          - Use clear section headers so reviewers can scan quickly
          - Lead with the strongest argument first
          - Be concise — payer reviewers process hundreds of appeals daily
          - Use bullet points for evidence and findings
          - State the specific action requested upfront
          - Reference specific codes, dates, and amounts (not vague language)
          - Tone: professional, factual, assertive but respectful

          STRICT ANTI-HALLUCINATION RULES:
          - ONLY use patient names, dates, codes, amounts, and clinical findings that appear verbatim in the data sections below
          - Do NOT invent clinical reasoning, differential diagnoses, or medical explanations not found in the extracted text
          - Do NOT list documents in "Supporting Documentation" unless they appear in the EOB/MEDICAL RECORDS/PRIOR AUTH sections below
          - Do NOT add symptoms, conditions, or clinical scenarios not explicitly stated in the extracted text
          - Do NOT speculate about why a procedure was performed unless the medical record text explicitly states the indication
          - If the extracted data is limited, write a shorter, factual letter rather than padding with invented content
          - ONLY cite payer policies from the RETRIEVED PAYER POLICIES section (from OpenSearch RAG)
          - If no payer policies were retrieved, say "Per standard coverage guidelines" — do NOT invent policy details

          === CLAIM INFORMATION (use these values directly in the letter) ===
          Claim ID: {claim_id}
          Patient Name: {patient_name}
          Patient ID: {patient_id}
          Payer: {_payer}
          Claim Amount: {_amount_str}
          Date of Service: {_dos}
          Denial Code: {_denial_code}

          === ANALYSIS RESULTS ===
          {json.dumps(analysis, indent=2) if isinstance(analysis, dict) else analysis}

          === MEDICAL ENTITIES ===
          Diagnoses: {json.dumps([d['text'] for d in parsed_entities.get('diagnoses', [])], indent=2)}
          Procedures: {json.dumps([p['text'] for p in parsed_entities.get('procedures', [])], indent=2)}
          Medications: {json.dumps([m['text'] for m in parsed_entities.get('medications', [])], indent=2)}
          {related_section}
          === APPEAL LETTER STRUCTURE ===
          Generate the letter in this exact structure. Use clear formatting with proper spacing.

          1. HEADER (formatted as a block):
             Date: [current date]
             
             To: {_payer} Appeals Department
             
             RE: Formal Appeal - Claim #{claim_id}
                 Patient: {patient_name}
                 Patient ID: {patient_id}
                 Amount in Dispute: {_amount_str}
                 Date of Service: {_dos}

          2. PATIENT INFORMATION (table format):
             Patient Name: {patient_name}
             Patient ID: {patient_id}
             Date of Service: {_dos}

          3. INSURANCE INFORMATION (table format):
             Payer: {_payer}
             Claim Number: {claim_id}
             Claim Amount: {_amount_str}

          4. DENIAL DETAILS (table format):
             Denial Code: [CARC code and description]
             Denial Category: [category]
             Denial Date: [if available from EOB]

          5. INTRODUCTION AND APPEAL STATEMENT (1 paragraph):
             - State this is a formal appeal
             - Reference the denial code
             - State what action is requested

          6. CLINICAL SUMMARY (structured, not a wall of text):
             Provider: [Dr. Name] at [Facility]
             
             Chief Complaint: [primary diagnosis]
             
             Clinical Findings:
             - Vital Signs: BP [x/x], HR [x], Temp [x]F
             - Diagnosis: [ICD-10 code] - [description]
             - Procedure: [CPT code] - [description]
             
             Clinical Notes: [brief summary of relevant notes]

          7. MEDICAL NECESSITY JUSTIFICATION (numbered points):
             - Why this service was medically necessary
             - Cite specific clinical evidence from the medical record
             - Reference diagnosis-procedure relationship

          8. CODING AND BILLING ANALYSIS:
             - If coding error: explain the correct code and why
             - If authorization issue: reference the PA number and approval
             - If documentation issue: explain what documentation supports the claim

          9. FINANCIAL IMPACT:
              - Original Claim Amount: {_amount_str}
              - Requested Payment: {_amount_str}

          10. REQUEST FOR RECONSIDERATION (clear and direct):
              "Based on the clinical evidence presented above, we request that {_payer} overturn the denial of Claim #{claim_id} and process full payment of {_amount_str}."

          11. SUBMISSION AND DEADLINE:
              - Appeal Deadline: [from analysis if available]
              - "We request a response within 30 business days."

          12. CLOSING:
              Sincerely,
              Revenue Cycle Management Department

          IMPORTANT NOTES:
          - Do NOT include a "Policy Reference" section - the appeal grounds are based on clinical evidence extracted from the actual claim documents (EOBs, medical records, prior authorizations) analyzed by our system
          - Do NOT include an "Enclosed Documentation", "Attachments", or "Supporting Documentation Enclosed" section
          - Do NOT invent policy numbers or cite policies not in the RETRIEVED PAYER POLICIES section
          - If payer policies were retrieved from the knowledge base, reference them naturally within the Medical Necessity or Coding sections
          - Never output text in square brackets like [Provider Name] - if data is not available, omit that line
          - Replace all em-dashes with regular hyphens
          - Format clinical findings as a clean list, not a run-on sentence
             - Do NOT include placeholder brackets like [Provider Name], [Title], [NPI Number], or [Contact Information]
             - Do NOT output any lines with square bracket placeholders

          CRITICAL TONE: Write assertively. Do NOT use hedging language like "we acknowledge", "we recognize", "we are prepared to submit", "may not have included". Instead, present the clinical evidence directly and demand reconsideration based on the facts.

          IMPORTANT: Never output text in square brackets like [Provider Name] or [Date of Service]. If data is not available, omit that line entirely."""

          def fallback_response(action, claim_id, parsed_entities, claim_details):
              recovery = calculate_recovery_score(claim_details, parsed_entities)
              
              if action == 'analyze':
                  return {
                      'statusCode': 200,
                      'action': action,
                      'claimId': claim_id,
                      'agentResponse': json.dumps({
                          'denialReason': claim_details.get('denialCategory', 'REQUIRES_REVIEW'),
                          'denialReasonDetail': DENIAL_CLASSIFICATIONS.get(claim_details.get('denialCode', ''), {}).get('description', 'Requires manual review'),
                          'successProbability': recovery['successProbability'],
                          'appealStrategy': 'Submit appeal with medical necessity documentation and clinical notes',
                          'priorityScore': recovery['priorityScore'],
                          'dollarImpact': claim_details.get('claimAmount', 0),
                          'expectedRecovery': recovery['expectedRecovery'],
                          'recoveryOpportunity': recovery['recoveryOpportunity'],
                          'keyFindings': [
                              f"Denial code: {claim_details.get('denialCode', 'Unknown')}",
                              f"Found {len(parsed_entities.get('diagnoses', []))} diagnoses",
                              f"Found {len(parsed_entities.get('procedures', []))} procedures"
                          ],
                          'medicalNecessityEvidence': [d['text'] for d in parsed_entities.get('diagnoses', [])][:3],
                          'missingDocumentation': ['Clinical notes', 'Prior authorization', 'Lab results'],
                          'relevantPolicies': [],
                          'recommendedActions': [
                              'Gather supporting clinical documentation',
                              'Review payer policy for coverage criteria',
                              'Submit appeal within deadline'
                          ]
                      }),
                      'fallback': True,
                      'parsedEntities': parsed_entities,
                      'claimDetails': claim_details
                  }
              else:
                  # Build enhanced appeal letter with all available data
                  from datetime import datetime
                  current_date = datetime.now().strftime('%B %d, %Y')
                  
                  payer_name = claim_details.get('payer', 'Insurance Company')
                  denial_category = claim_details.get('denialCategory', 'Unknown')
                  denial_code = claim_details.get('denialCode', 'N/A')
                  claim_amount = claim_details.get('claimAmount', 0)
                  cpt_codes = claim_details.get('cptCodes', [])
                  icd_codes = claim_details.get('icdCodes', [])
                  
                  # Get diagnoses and procedures
                  diagnoses = parsed_entities.get('diagnoses', [])
                  procedures = parsed_entities.get('procedures', [])
                  medications = parsed_entities.get('medications', [])
                  test_results = parsed_entities.get('testResults', [])
                  
                  # Build diagnosis section
                  diagnosis_text = ""
                  if diagnoses:
                      diagnosis_text = chr(10).join([f"  - {d['text']}" for d in diagnoses[:5]])
                  else:
                      diagnosis_text = "  - Clinical documentation supports medical necessity (see attached records)"
                  
                  # Build procedure section
                  procedure_text = ""
                  if procedures:
                      procedure_text = chr(10).join([f"  - {p['text']}" for p in procedures[:5]])
                  elif cpt_codes:
                      procedure_text = chr(10).join([f"  - CPT Code: {code}" for code in cpt_codes[:5]])
                  else:
                      procedure_text = "  - See attached clinical documentation for procedure details"
                  
                  # Build medication section
                  medication_text = ""
                  if medications:
                      medication_text = f"""
          MEDICATIONS PRESCRIBED:
          {chr(10).join([f"  - {m['text']}" for m in medications[:5]])}
          """
                  
                  # Build test results section
                  test_text = ""
                  if test_results:
                      test_text = f"""
          DIAGNOSTIC TESTS AND RESULTS:
          {chr(10).join([f"  - {t['text']}" for t in test_results[:5]])}
          """
                  
                  # Build ICD codes section
                  icd_text = ""
                  if icd_codes:
                      icd_text = f"""
          ICD-10 DIAGNOSIS CODES:
          {chr(10).join([f"  - {code}" for code in icd_codes[:5]])}
          """
                  
                  # Denial-specific appeal strategy
                  appeal_strategies = {
                      'MEDICAL_NECESSITY': 'The enclosed clinical documentation clearly demonstrates that the services rendered were medically necessary based on the patient\'s presenting condition, clinical findings, and established standards of care.',
                      'AUTH_REQUIRED': 'We are providing documentation that demonstrates the urgent/emergent nature of the services, which precluded obtaining prior authorization. Additionally, we are submitting a retrospective authorization request.',
                      'CODING_ERROR': 'Upon review, we have verified that the procedure and diagnosis codes accurately reflect the services provided. Please see the attached operative report and clinical notes for clarification.',
                      'MISSING_INFO': 'We are providing the requested documentation to support this claim. All required information is now enclosed for your review.',
                      'DUPLICATE': 'This claim represents a distinct service from the previously processed claim. Please see the attached documentation showing different dates of service, procedures, or anatomical sites.',
                      'BUNDLED': 'The services billed separately are distinct procedures that should not be bundled according to CCI edits and payer policy. Documentation supporting separate reimbursement is enclosed.',
                      'NON_COVERED': 'We believe this service should be covered under the patient\'s benefit plan. Please review the enclosed documentation demonstrating coverage eligibility.',
                      'TIMELY_FILING': 'We are providing documentation showing that the original claim was submitted within the timely filing deadline, or demonstrating circumstances that warrant an exception.',
                      'UNKNOWN': 'We respectfully request reconsideration of this denial based on the enclosed clinical documentation.'
                  }
                  
                  appeal_strategy = appeal_strategies.get(denial_category, appeal_strategies['UNKNOWN'])
                  
                  appeal_letter = f"""{current_date}

          {payer_name}
          Appeals Department

          RE: FORMAL APPEAL - Claim #{claim_id}
              Patient: {patient_name}
              Patient ID: {patient_id}
              Claim Amount: ${claim_amount:,.2f}
              Denial Code: {denial_code}

          Dear Appeals Committee,

          I am writing to formally appeal the denial of the above-referenced claim. The claim was denied with reason code {denial_code} ({denial_category}).

          REASON FOR APPEAL:
          {appeal_strategy}

          PATIENT DIAGNOSIS AND CLINICAL PRESENTATION:
          {diagnosis_text}
          {icd_text}
          SERVICES/PROCEDURES PROVIDED:
          {procedure_text}
          {medication_text}{test_text}
          MEDICAL NECESSITY JUSTIFICATION:
          The patient's clinical presentation and documented medical history clearly support the medical necessity of the services rendered. The treating physician determined that these services were essential for:
            1. Accurate diagnosis of the patient's condition
            2. Appropriate treatment based on clinical findings
            3. Prevention of disease progression or complications
            4. Adherence to established clinical guidelines and standards of care

          SUPPORTING DOCUMENTATION ENCLOSED:
            - Clinical notes and medical records
            - Operative/procedure report (if applicable)
            - Laboratory and diagnostic test results
            - Prior authorization documentation (if applicable)
            - Relevant clinical guidelines supporting medical necessity

          REQUEST FOR ACTION:
          Based on the enclosed documentation, we respectfully request that you:
            1. Overturn the denial and reprocess this claim for payment
            2. Provide a detailed explanation if the denial is upheld
            3. Advise of any additional documentation needed for reconsideration

          Please contact our office if you require any additional information. We request an expedited review given the patient's ongoing care needs.

          Thank you for your prompt attention to this matter.

          Sincerely,

          Revenue Cycle Management Department

          Enclosures: Clinical Documentation Package"""
                  
                  return {
                      'statusCode': 200,
                      'action': action,
                      'claimId': claim_id,
                      'agentResponse': appeal_letter,
                      'fallback': True,
                      'parsedEntities': parsed_entities,
