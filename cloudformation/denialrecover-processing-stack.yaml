  GenerateAppealPdfFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-generate-appeal-pdf'
      Description: Generates professional PDF appeal letters from text content
      Runtime: python3.11
      Handler: index.handler
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt GenerateAppealPdfRole.Arn
      Layers:
        - arn:aws:lambda:us-east-1:193786182229:layer:denialrecover-dev-reportlab-layer:1
      Environment:
        Variables:
          DATA_BUCKET:
            Fn::ImportValue: !Sub '${DataStackName}-DataBucket'
          LOG_LEVEL: !If [IsProd, 'INFO', 'DEBUG']
          CODE_VERSION: '2026-05-19-v8'
      Code:
        ZipFile: |
          import os
          import json
          import logging
          import boto3
          import io
          from datetime import datetime

          logger = logging.getLogger()
          logger.setLevel(os.environ.get('LOG_LEVEL', 'INFO'))

          s3 = boto3.client('s3')
          DATA_BUCKET = os.environ['DATA_BUCKET']

          def handler(event, context):
              logger.info(f"Received event: {json.dumps(event)}")
              
              claim_id = event.get('claimId', 'unknown')
              appeal_text = event.get('appealText', '')
              bucket = event.get('bucket', DATA_BUCKET)
              claim_details = event.get('claimDetails', {})
              parsed_entities = event.get('parsedEntities', {})
              analysis_json = event.get('analysisJson', '{}')
              
              # Parse analysis JSON if it's a string
              analysis_data = {}
              if isinstance(analysis_json, str):
                  try:
                      analysis_data = json.loads(analysis_json)
                  except:
                      analysis_data = {}
              elif isinstance(analysis_json, dict):
                  analysis_data = analysis_json
              
              if not appeal_text:
                  return {
                      'statusCode': 400,
                      'error': 'No appeal text provided',
                      'claimId': claim_id
                  }
              
              try:
                  # Generate PDF using pure Python (no external dependencies)
                  pdf_bytes = generate_pdf_simple(claim_id, appeal_text, claim_details, parsed_entities, analysis_data)
                  
                  # Upload to S3
                  pdf_key = f'appeals/{claim_id}/appeal_letter.pdf'
                  s3.put_object(
                      Bucket=bucket,
                      Key=pdf_key,
                      Body=pdf_bytes,
                      ContentType='application/pdf',
                      ServerSideEncryption='AES256'
                  )
                  
                  logger.info(f"PDF generated and saved to s3://{bucket}/{pdf_key}")
                  
                  return {
                      'statusCode': 200,
                      'claimId': claim_id,
                      'pdfKey': pdf_key,
                      'bucket': bucket,
                      'message': 'PDF generated successfully'
                  }
                  
              except Exception as e:
                  logger.error(f"Error generating PDF: {str(e)}")
                  # Fallback: save as text file
                  txt_key = f'appeals/{claim_id}/appeal_letter.txt'
                  s3.put_object(
                      Bucket=bucket,
                      Key=txt_key,
                      Body=appeal_text.encode('utf-8'),
                      ContentType='text/plain',
                      ServerSideEncryption='AES256'
                  )
                  return {
                      'statusCode': 200,
                      'claimId': claim_id,
                      'pdfKey': txt_key,
                      'bucket': bucket,
                      'message': 'Saved as text (PDF generation failed)',
                      'error': str(e)
                  }

          def generate_pdf_simple(claim_id, appeal_text, claim_details, parsed_entities, analysis_data=None):
              """Generate a professional, UX-friendly PDF appeal letter with title, table, bold headers, bullets."""
              import re as _re
              from datetime import date

              if not analysis_data:
                  analysis_data = {}

              # ---- Constants ----
              PAGE_W, PAGE_H = 612, 792
              MARGIN_L, MARGIN_R, MARGIN_T, MARGIN_B = 72, 72, 60, 60
              CONTENT_W = PAGE_W - MARGIN_L - MARGIN_R
              TOP_Y = PAGE_H - MARGIN_T

              # Font sizes (professional look)
              TITLE_SIZE = 16
              HEADER_SIZE = 12
              BODY_SIZE = 10.5
              TABLE_SIZE = 9.5
              SMALL_SIZE = 8.5

              # Leading (line spacing - more breathing room)
              TITLE_LEAD = 24
              HEADER_LEAD = 22
              BODY_LEAD = 15
              TABLE_LEAD = 16
              BULLET_LEAD = 15
              BLANK_LEAD = 8

              # ---- Helpers ----
              def esc(t):
                  return t.replace('\\', '\\\\').replace('(', '\\(').replace(')', '\\)').replace('\r', '')

              def strip_md(t):
                  t = _re.sub(r'```[a-z]*\n?', '', t)
                  t = _re.sub(r'```', '', t)
                  # Replace em-dashes and other Unicode chars that break latin-1 encoding
                  t = t.replace('\u2014', '-').replace('\u2013', '-')  # em-dash, en-dash
                  t = t.replace('\u2018', "'").replace('\u2019', "'")  # smart quotes
                  t = t.replace('\u201c', '"').replace('\u201d', '"')  # smart double quotes
                  t = t.replace('\u2022', '*')  # bullet
                  t = t.replace('\u2026', '...')  # ellipsis
                  t = _re.sub(r'\*\*([^*]+)\*\*', r'\1', t)
                  t = _re.sub(r'\*([^*]+)\*', r'\1', t)
                  t = _re.sub(r'__([^_]+)__', r'\1', t)
                  t = _re.sub(r'^\s*#{1,6}\s+', '', t, flags=_re.MULTILINE)
                  t = _re.sub(r'^---+\s*$', '', t, flags=_re.MULTILINE)
                  t = _re.sub(r'^\*\*\s*$', '', t, flags=_re.MULTILINE)
                  return t

              def wrap_line(text, max_chars=90):
                  if len(text) <= max_chars:
                      return [text]
                  result = []
                  while len(text) > max_chars:
                      cut = text.rfind(' ', 0, max_chars)
                      if cut <= 0:
                          cut = max_chars
                      result.append(text[:cut])
                      text = text[cut:].lstrip()
                  if text:
                      result.append(text)
                  return result

              # Approximate char width for Helvetica at size 1
              def str_width(text, size):
                  avg_char = size * 0.52
                  return len(text) * avg_char

              # ---- Extract claim metadata for table ----
              patient_name = claim_details.get('patientName', claim_details.get('patient_name', ''))
              member_id = claim_details.get('memberId', claim_details.get('member_id', ''))
              service_date = claim_details.get('dateOfService', claim_details.get('service_date', ''))
              claim_amount = claim_details.get('claimAmount', claim_details.get('claim_amount', ''))
              payer_name = claim_details.get('payerName', claim_details.get('payer_name', ''))
              denial_codes = claim_details.get('denialCodes', claim_details.get('denial_codes', ''))

              if isinstance(claim_amount, (int, float)):
                  claim_amount = f'${claim_amount:,.2f}'
              elif claim_amount and not str(claim_amount).startswith('$'):
                  claim_amount = f'${claim_amount}'

              # ---- Build structured content ----
              # Content items: list of dicts with type and data
              # Types: title, hr, table, header, body, bullet, numbered, blank
              content = []

              # Go directly to the appeal letter content (no separate title page)
              if analysis_data:
                  content.append({'type': 'blank', 'height': 8})

              # Strip duplicate "Appeal Letter" header from Claude's response
              clean_text = strip_md(appeal_text)
              
              # Remove "Enclosed Documentation" / "Supporting Documentation" sections entirely
              clean_text = _re.sub(r'(?i)(ENCLOSED DOCUMENTATION|SUPPORTING DOCUMENTATION ENCLOSED|SUPPORTING DOCUMENTATION|ATTACHMENTS|ENCLOSURES)[:\s]*\n([\s\S]*?)(?=\n[A-Z]{2,}|\n(?:Sincerely|REQUEST|SUBMISSION|FINANCIAL|CLOSING)|$)', '', clean_text)
              # Also remove lines that start with bullet points listing enclosed docs
              clean_text = _re.sub(r'(?m)^[\s\-\*]*(?:eob_|medical_record_|prior_auth_|claim_).*\.pdf.*$', '', clean_text)
              
              # Remove leading "Appeal Letter" or "APPEAL LETTER" lines
              lines_raw = clean_text.split('\n')
              while lines_raw and lines_raw[0].strip().lower().replace('*', '').replace('#', '').strip() in ('appeal letter', 'appeal letter:', ''):
                  lines_raw.pop(0)
              lines = lines_raw

              for raw in lines:
                  s = raw.strip()
                  if not s:
                      content.append({'type': 'blank', 'height': BLANK_LEAD})
                      continue

                  # Detect headers: ALL CAPS lines or lines ending with colon that are short
                  is_header = False
                  if s.isupper() and len(s) > 3 and len(s) < 80 and not s[0].isdigit():
                      is_header = True
                  elif s.endswith(':') and len(s) < 60 and not s.startswith('-') and not s[0].isdigit():
                      # Title-case lines ending with colon
                      words = s.rstrip(':').split()
                      if len(words) <= 8 and sum(1 for w in words if w[0:1].isupper()) >= len(words) * 0.5:
                          is_header = True

                  if is_header:
                      content.append({'type': 'blank', 'height': 8})
                      # Convert to title case for display
                      display = s.rstrip(':')
                      if display.isupper():
                          display = display.title()
                      content.append({'type': 'header', 'text': display})
                      content.append({'type': 'blank', 'height': 4})
                  elif s.startswith('- ') or s.startswith('* ') or _re.match(r'^[\u2022\u2023\u25E6]', s):
                      body = _re.sub(r'^[-*\u2022\u2023\u25E6]\s*', '', s)
                      content.append({'type': 'bullet', 'text': body})
                  elif _re.match(r'^\d+\.\s', s):
                      content.append({'type': 'numbered', 'text': s})
                  else:
                      content.append({'type': 'body', 'text': s})

              # ---- Render to PDF page streams ----
              # Each page is a list of drawing commands
              class PDFRenderer:
                  def __init__(self):
                      self.pages = []
                      self.current_page = []
                      self.y = TOP_Y
                      self.start_new_page()

                  def start_new_page(self):
                      if self.current_page:
                          self.pages.append(self.current_page)
                      self.current_page = []
                      self.y = TOP_Y

                  def check_space(self, needed):
                      if self.y - needed < MARGIN_B:
                          self.start_new_page()

                  def draw_text(self, x, y, font, size, text):
                      self.current_page.append(f'BT /{font} {size} Tf 1 0 0 1 {x:.1f} {y:.1f} Tm ({esc(text)}) Tj ET')

                  def draw_line(self, x1, y1, x2, y2, width=0.5):
                      self.current_page.append(f'{width} w {x1:.1f} {y1:.1f} m {x2:.1f} {y2:.1f} l S')

                  def draw_rect(self, x, y, w, h, fill_gray=None):
                      if fill_gray is not None:
                          self.current_page.append(f'{fill_gray} g {x:.1f} {y:.1f} {w:.1f} {h:.1f} re f 0 g')
                      self.current_page.append(f'{x:.1f} {y:.1f} {w:.1f} {h:.1f} re S')

                  def render_title(self, text):
                      self.check_space(TITLE_LEAD + 16)
                      tw = str_width(text, TITLE_SIZE)
                      x = MARGIN_L + (CONTENT_W - tw) / 2
                      self.draw_text(x, self.y, 'F2', TITLE_SIZE, text)
                      self.y -= TITLE_LEAD
                      # Underline title
                      self.draw_line(MARGIN_L + 40, self.y + 4, PAGE_W - MARGIN_R - 40, self.y + 4, 1.0)
                      self.y -= 8

                  def render_hr(self):
                      self.check_space(12)
                      self.y -= 6
                      self.draw_line(MARGIN_L, self.y, PAGE_W - MARGIN_R, self.y, 0.5)
                      self.y -= 6

                  def render_table(self, rows):
                      col1_w = 140
                      col2_w = CONTENT_W - col1_w
                      row_h = TABLE_LEAD + 4
                      total_h = (len(rows) + 1) * row_h + 4
                      self.check_space(total_h)

                      table_x = MARGIN_L
                      table_y = self.y

                      # Header row with gray background
                      self.draw_rect(table_x, table_y - row_h, CONTENT_W, row_h, 0.9)
                      self.draw_text(table_x + 8, table_y - row_h + 6, 'F2', TABLE_SIZE, 'Field')
                      self.draw_text(table_x + col1_w + 8, table_y - row_h + 6, 'F2', TABLE_SIZE, 'Value')
                      self.y = table_y - row_h

                      # Data rows
                      for field, value in rows:
                          self.draw_rect(table_x, self.y - row_h, CONTENT_W, row_h)
                          self.draw_line(table_x + col1_w, self.y, table_x + col1_w, self.y - row_h, 0.3)
                          self.draw_text(table_x + 8, self.y - row_h + 6, 'F1', TABLE_SIZE, field)
                          # Truncate long values
                          disp_val = value[:70] if len(value) > 70 else value
                          self.draw_text(table_x + col1_w + 8, self.y - row_h + 6, 'F1', TABLE_SIZE, disp_val)
                          self.y -= row_h

                      self.y -= 4

                  def render_header(self, text):
                      self.check_space(HEADER_LEAD + 16)
                      self.y -= 8  # Extra space before header
                      # Gray background bar behind header text
                      bar_h = HEADER_SIZE + 8
                      self.draw_rect(MARGIN_L, self.y - 2, CONTENT_W, bar_h, 0.92)
                      self.draw_text(MARGIN_L + 8, self.y + 2, 'F2', HEADER_SIZE, text.upper())
                      self.y -= HEADER_LEAD

                  def render_body(self, text):
                      wrapped = wrap_line(text, 88)
                      self.check_space(BODY_LEAD * len(wrapped))
                      for ln in wrapped:
                          self.draw_text(MARGIN_L + 4, self.y, 'F1', BODY_SIZE, ln)
                          self.y -= BODY_LEAD

                  def render_bullet(self, text):
                      wrapped = wrap_line(text, 82)
                      self.check_space(BULLET_LEAD * len(wrapped))
                      self.draw_text(MARGIN_L + 16, self.y, 'F1', BODY_SIZE, '\x95  ' + wrapped[0])
                      self.y -= BULLET_LEAD
                      for ln in wrapped[1:]:
                          self.draw_text(MARGIN_L + 28, self.y, 'F1', BODY_SIZE, ln)
                          self.y -= BULLET_LEAD

                  def render_numbered(self, text):
                      wrapped = wrap_line(text, 87)
                      self.check_space(BULLET_LEAD * len(wrapped))
                      self.draw_text(MARGIN_L + 8, self.y, 'F1', BODY_SIZE, wrapped[0])
                      self.y -= BULLET_LEAD
                      for ln in wrapped[1:]:
                          self.draw_text(MARGIN_L + 24, self.y, 'F1', BODY_SIZE, ln)
                          self.y -= BULLET_LEAD

                  def render_blank(self, height):
                      self.y -= height

                  def finalize(self):
                      if self.current_page:
                          self.pages.append(self.current_page)
                      return self.pages

              # ---- Render all content ----
              renderer = PDFRenderer()
              for item in content:
                  t = item['type']
                  if t == 'title':
                      renderer.render_title(item['text'])
                  elif t == 'hr':
                      renderer.render_hr()
                  elif t == 'table':
                      renderer.render_table(item['rows'])
                  elif t == 'header':
                      renderer.render_header(item['text'])
                  elif t == 'body':
                      renderer.render_body(item['text'])
                  elif t == 'bullet':
                      renderer.render_bullet(item['text'])
                  elif t == 'numbered':
                      renderer.render_numbered(item['text'])
                  elif t == 'blank':
                      renderer.render_blank(item.get('height', BLANK_LEAD))
                  elif t == 'page_break':
                      renderer.start_new_page()

              rendered_pages = renderer.finalize()

              # ---- Build PDF streams ----
              def build_stream(page_cmds):
                  return '\n'.join(page_cmds).encode('latin-1', errors='replace')

              streams = [build_stream(p) for p in rendered_pages]
              n = len(streams) if streams else 1
              if not streams:
                  streams = [b'BT /F1 10 Tf 1 0 0 1 72 720 Tm (No content) Tj ET']

              # ---- Assemble PDF file ----
              buf = io.BytesIO()
              buf.write(b'%PDF-1.4\n%\xe2\xe3\xcf\xd3\n')

              offsets = {}
              obj_counter = [1]

              def next_id():
                  i = obj_counter[0]; obj_counter[0] += 1; return i

              def write_obj(oid_val, data):
                  offsets[oid_val] = buf.tell()
                  buf.write(f'{oid_val} 0 obj\n'.encode())
                  if isinstance(data, bytes):
                      buf.write(data)
                  else:
                      buf.write(data.encode('latin-1', errors='replace'))
                  buf.write(b'\nendobj\n')

              cat_id = next_id()
              pgs_id = next_id()
              f1_id = next_id()
              f2_id = next_id()
              pg_ids = [next_id() for _ in range(n)]
              st_ids = [next_id() for _ in range(n)]

              write_obj(cat_id, f'<< /Type /Catalog /Pages {pgs_id} 0 R >>')
              kids = ' '.join(f'{pid} 0 R' for pid in pg_ids)
              write_obj(pgs_id, f'<< /Type /Pages /Kids [{kids}] /Count {n} >>')
              write_obj(f1_id, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>')
              write_obj(f2_id, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>')

              res_dict = f'<< /Font << /F1 {f1_id} 0 R /F2 {f2_id} 0 R >> >>'
              for pg_id, st_id, stream in zip(pg_ids, st_ids, streams):
                  write_obj(pg_id, f'<< /Type /Page /Parent {pgs_id} 0 R /MediaBox [0 0 {PAGE_W} {PAGE_H}] /Contents {st_id} 0 R /Resources {res_dict} >>')
                  offsets[st_id] = buf.tell()
                  hdr = f'{st_id} 0 obj\n<< /Length {len(stream)} >>\nstream\n'.encode()
                  buf.write(hdr + stream + b'\nendstream\nendobj\n')

              total_objs = obj_counter[0]
              xref_pos = buf.tell()
              buf.write(b'xref\n')
              buf.write(f'0 {total_objs}\n'.encode())
              buf.write(b'0000000000 65535 f \n')
              for i in range(1, total_objs):
                  buf.write(f'{offsets.get(i, 0):010d} 00000 n \n'.encode())
              buf.write(f'trailer\n<< /Size {total_objs} /Root {cat_id} 0 R >>\nstartxref\n{xref_pos}\n%%EOF\n'.encode())

              return buf.getvalue()
