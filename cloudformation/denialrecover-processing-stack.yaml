  # ---------------------------------------------------------------------------
  # Lambda Function - Add to Priority Queue
  # ---------------------------------------------------------------------------
  PriorityQueueLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-priority-queue-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
