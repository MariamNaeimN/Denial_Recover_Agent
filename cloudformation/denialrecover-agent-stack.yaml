AWSTemplateFormatVersion: '2010-09-09'
Description: 'DenialRecover AI - Bedrock Agent + OpenSearch Knowledge Base'

Parameters:
  Environment:
    Type: String
    Default: dev
  ProjectName:
    Type: String
    Default: denialrecover
  DataStackName:
    Type: String
    Default: denialrecover-dev
    Description: Name of the data stack to import resources from
  OpenSearchLayerArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:193786182229:layer:denialrecover-dev-opensearch-layer:1
    Description: ARN of the Lambda Layer containing opensearch-py and requests-aws4auth

Resources:
  # ---------------------------------------------------------------------------
  # OpenSearch Serverless Collection (Knowledge Base)
  # ---------------------------------------------------------------------------
  OpenSearchEncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-encryption'
      Type: encryption
      Policy: !Sub |
        {
          "Rules": [
            {
              "ResourceType": "collection",
              "Resource": ["collection/${ProjectName}-${Environment}-kb"]
            }
          ],
          "AWSOwnedKey": true
        }

  OpenSearchNetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-network'
      Type: network
      Policy: !Sub |
        [
          {
            "Rules": [
              {
                "ResourceType": "collection",
                "Resource": ["collection/${ProjectName}-${Environment}-kb"]
              },
              {
                "ResourceType": "dashboard",
                "Resource": ["collection/${ProjectName}-${Environment}-kb"]
              }
            ],
            "AllowFromPublic": true
          }
        ]

  OpenSearchDataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    DependsOn:
      - OpenSearchManagerRole
      - AgentActionLambdaRole
      - OpenSearchRealtimeSyncRole
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-access'
      Type: data
      Policy: !Sub |
        [
          {
            "Rules": [
              {
                "ResourceType": "collection",
                "Resource": ["collection/${ProjectName}-${Environment}-kb"],
                "Permission": ["aoss:*"]
              },
              {
                "ResourceType": "index",
                "Resource": ["index/${ProjectName}-${Environment}-kb/*"],
                "Permission": ["aoss:*"]
              }
            ],
            "Principal": [
              "arn:aws:iam::${AWS::AccountId}:root",
              "${BedrockAgentRole.Arn}",
              "${KnowledgeBaseRole.Arn}",
              "${OpenSearchManagerRole.Arn}",
              "${AgentActionLambdaRole.Arn}",
              "${OpenSearchRealtimeSyncRole.Arn}"
            ]
          }
        ]

  OpenSearchCollection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn:
      - OpenSearchEncryptionPolicy
      - OpenSearchNetworkPolicy
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-kb'
      Type: VECTORSEARCH
      Description: Knowledge base for payer policies and claim history
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment


  # ---------------------------------------------------------------------------
  # IAM Roles
  # ---------------------------------------------------------------------------
  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-kb-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: KnowledgeBasePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-PayerRulesBucketArn'
                  - !Sub 
                    - '${BucketArn}/*'
                    - BucketArn:
                        Fn::ImportValue: !Sub '${DataStackName}-PayerRulesBucketArn'
              - Effect: Allow
                Action:
                  - aoss:APIAccessAll
                Resource: !Sub 'arn:aws:aoss:${AWS::Region}:${AWS::AccountId}:collection/*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'

  BedrockAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-agent-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockAgentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:Retrieve
                  - bedrock:RetrieveAndGenerate
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-DataBucketArn'
                  - !Sub 
                    - '${BucketArn}/*'
                    - BucketArn:
                        Fn::ImportValue: !Sub '${DataStackName}-DataBucketArn'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-ClaimsTableArn'
                  - !Sub 
                    - '${TableArn}/index/*'
                    - TableArn:
                        Fn::ImportValue: !Sub '${DataStackName}-ClaimsTableArn'
                  - Fn::ImportValue: !Sub '${DataStackName}-DenialAnalysisTableArn'
                  - Fn::ImportValue: !Sub '${DataStackName}-PriorityQueueTableArn'
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-${Environment}-*'
              - Effect: Allow
                Action:
                  - aoss:APIAccessAll
                Resource: !Sub 'arn:aws:aoss:${AWS::Region}:${AWS::AccountId}:collection/*'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-KMSKey'


  # ---------------------------------------------------------------------------
  # Lambda Functions for Agent Action Groups
  # ---------------------------------------------------------------------------
  AgentActionLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-agent-action-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AgentActionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-ClaimsTableArn'
                  - !Sub 
                    - '${TableArn}/index/*'
                    - TableArn:
                        Fn::ImportValue: !Sub '${DataStackName}-ClaimsTableArn'
                  - Fn::ImportValue: !Sub '${DataStackName}-DenialAnalysisTableArn'
                  - Fn::ImportValue: !Sub '${DataStackName}-PriorityQueueTableArn'
                  - Fn::ImportValue: !Sub '${DataStackName}-AppealOutcomesTableArn'
                  - Fn::ImportValue: !Sub '${DataStackName}-CompaniesTableArn'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-DataBucketArn'
                  - !Sub 
                    - '${BucketArn}/*'
                    - BucketArn:
                        Fn::ImportValue: !Sub '${DataStackName}-DataBucketArn'
                  - Fn::ImportValue: !Sub '${DataStackName}-PayerRulesBucketArn'
                  - !Sub 
                    - '${BucketArn}/*'
                    - BucketArn:
                        Fn::ImportValue: !Sub '${DataStackName}-PayerRulesBucketArn'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  - Fn::ImportValue: !Sub '${DataStackName}-KMSKey'
              # OpenSearch permissions for SearchPoliciesFunction
              - Effect: Allow
                Action:
                  - aoss:APIAccessAll
                Resource: !Sub 'arn:aws:aoss:${AWS::Region}:${AWS::AccountId}:collection/*'
              # Bedrock permissions for embedding generation
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'

  # Action Group Lambda - Query Claims (with Multi-Tenant Support)
  QueryClaimsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-query-claims'
      Description: Agent action to query claims from DynamoDB with company filtering
      Runtime: python3.11
      Handler: index.handler
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt AgentActionLambdaRole.Arn
      Environment:
        Variables:
          CLAIMS_TABLE:
            Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
          ANALYSIS_TABLE:
            Fn::ImportValue: !Sub '${DataStackName}-DenialAnalysisTable'
          PRIORITY_TABLE:
            Fn::ImportValue: !Sub '${DataStackName}-PriorityQueueTable'
      Code:
        ZipFile: |
          import os
          import json
          import boto3
          from decimal import Decimal
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          dynamodb = boto3.resource('dynamodb')
          CLAIMS_TABLE = os.environ['CLAIMS_TABLE']
          ANALYSIS_TABLE = os.environ['ANALYSIS_TABLE']
          PRIORITY_TABLE = os.environ['PRIORITY_TABLE']

          class DecimalEncoder(json.JSONEncoder):
              def default(self, o):
                  if isinstance(o, Decimal):
                      return float(o)
                  return super().default(o)

          def handler(event, context):
              logger.info(f"Received event: {json.dumps(event)}")
              
              agent = event.get('agent', {})
              action_group = event.get('actionGroup', '')
              api_path = event.get('apiPath', '')
              parameters = event.get('parameters', [])
              
              params = {p['name']: p['value'] for p in parameters}
              company_id = params.get('companyId', 'default')
              
              if api_path == '/claims/by-status':
                  return query_by_status(company_id, params.get('status', 'APPEAL_GENERATED'))
              elif api_path == '/claims/by-payer':
                  return query_by_payer(company_id, params.get('payerId'))
              elif api_path == '/claims/priority':
                  return get_priority_queue(company_id)
              elif api_path == '/claims/{claimId}':
                  return get_claim(company_id, params.get('claimId'))
              elif api_path == '/claims/stats':
                  return get_stats(company_id)
              
              return {'statusCode': 404, 'body': 'Action not found'}

          def query_by_status(company_id, status):
              table = dynamodb.Table(CLAIMS_TABLE)
              response = table.query(
                  IndexName='status-index',
                  KeyConditionExpression='#status = :status',
                  FilterExpression='companyId = :company',
                  ExpressionAttributeNames={'#status': 'status'},
                  ExpressionAttributeValues={
                      ':status': status,
                      ':company': company_id
                  },
                  Limit=50
              )
              return format_response({
                  'companyId': company_id,
                  'status': status,
                  'claims': response.get('Items', []),
                  'count': len(response.get('Items', []))
              })

          def query_by_payer(company_id, payer_id):
              table = dynamodb.Table(CLAIMS_TABLE)
              response = table.query(
                  IndexName='payer-index',
                  KeyConditionExpression='payerId = :payer',
                  FilterExpression='companyId = :company',
                  ExpressionAttributeValues={
                      ':payer': payer_id,
                      ':company': company_id
                  },
                  Limit=50
              )
              return format_response({
                  'companyId': company_id,
                  'payerId': payer_id,
                  'claims': response.get('Items', []),
                  'count': len(response.get('Items', []))
              })

          def get_priority_queue(company_id):
              table = dynamodb.Table(PRIORITY_TABLE)
              response = table.scan(
                  FilterExpression='companyId = :company',
                  ExpressionAttributeValues={':company': company_id},
                  Limit=20
              )
              return format_response({
                  'companyId': company_id,
                  'priorityQueue': response.get('Items', []),
                  'count': len(response.get('Items', []))
              })

          def get_claim(company_id, claim_id):
              table = dynamodb.Table(CLAIMS_TABLE)
              response = table.get_item(Key={'claimId': claim_id})
              item = response.get('Item', {})
              
              # Verify company ownership
              if item and item.get('companyId') != company_id:
                  return format_response({'error': 'Claim not found or access denied', 'claimId': claim_id})
              
              return format_response({
                  'companyId': company_id,
                  'claim': item
              })

          def get_stats(company_id):
              table = dynamodb.Table(CLAIMS_TABLE)
              response = table.scan(
                  FilterExpression='companyId = :company',
                  ExpressionAttributeValues={':company': company_id},
                  Select='COUNT'
              )
              return format_response({
                  'companyId': company_id,
                  'totalClaims': response.get('Count', 0)
              })

          def format_response(data):
              return {
                  'messageVersion': '1.0',
                  'response': {
                      'actionGroup': 'ClaimActions',
                      'apiPath': '/claims',
                      'httpMethod': 'GET',
                      'httpStatusCode': 200,
                      'responseBody': {
                          'application/json': {
                              'body': json.dumps(data, cls=DecimalEncoder)
                          }
                      }
                  }
              }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  QueryClaimsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref QueryClaimsFunction
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceAccount: !Ref AWS::AccountId


  # Action Group Lambda - Search Payer Policies (with Multi-Tenant Support)
  SearchPoliciesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-search-policies'
      Description: Agent action to search payer policies with company filtering
      Runtime: python3.11
      Handler: index.handler
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt AgentActionLambdaRole.Arn
      Layers:
        - !Ref OpenSearchLayerArn
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !GetAtt OpenSearchCollection.CollectionEndpoint
          PAYER_RULES_BUCKET:
            Fn::ImportValue: !Sub '${DataStackName}-PayerRulesBucket'
          EMBEDDING_MODEL_ID: amazon.titan-embed-text-v2:0
      Code:
        ZipFile: |
          import os
          import json
          import boto3
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          s3 = boto3.client('s3')
          bedrock = boto3.client('bedrock-runtime')
          PAYER_RULES_BUCKET = os.environ['PAYER_RULES_BUCKET']
          OPENSEARCH_ENDPOINT = os.environ['OPENSEARCH_ENDPOINT']
          EMBEDDING_MODEL_ID = os.environ.get('EMBEDDING_MODEL_ID', 'amazon.titan-embed-text-v2:0')

          def handler(event, context):
              logger.info(f"Received event: {json.dumps(event)}")
              
              parameters = event.get('parameters', [])
              params = {p['name']: p['value'] for p in parameters}
              
              company_id = params.get('companyId', 'default')
              payer = params.get('payer', '').lower()
              denial_code = params.get('denialCode', '')
              cpt_code = params.get('cptCode', '')
              query = params.get('query', '')
              
              # If query provided, do semantic search
              if query:
                  return semantic_search(company_id, query, payer, denial_code)
              
              # Otherwise, list policies from S3 filtered by company
              return list_policies(company_id, payer, denial_code, cpt_code)

          def get_embedding(text):
              """Generate embedding using Amazon Titan"""
              try:
                  response = bedrock.invoke_model(
                      modelId=EMBEDDING_MODEL_ID,
                      contentType='application/json',
                      accept='application/json',
                      body=json.dumps({'inputText': text[:8000]})
                  )
                  result = json.loads(response['body'].read())
                  return result['embedding']
              except Exception as e:
                  logger.error(f"Error generating embedding: {str(e)}")
                  return None

          def semantic_search(company_id, query, payer, denial_code):
              """Perform semantic search in OpenSearch with company filtering"""
              try:
                  from opensearchpy import OpenSearch, RequestsHttpConnection
                  from requests_aws4auth import AWS4Auth
                  
                  region = boto3.session.Session().region_name
                  credentials = boto3.Session().get_credentials()
                  awsauth = AWS4Auth(
                      credentials.access_key,
                      credentials.secret_key,
                      region,
                      'aoss',
                      session_token=credentials.token
                  )
                  
                  host = OPENSEARCH_ENDPOINT.replace('https://', '')
                  client = OpenSearch(
                      hosts=[{'host': host, 'port': 443}],
                      http_auth=awsauth,
                      use_ssl=True,
                      verify_certs=True,
                      connection_class=RequestsHttpConnection,
                      timeout=30
                  )
                  
                  # Generate query embedding
                  query_embedding = get_embedding(query)
                  if not query_embedding:
                      return format_response({'error': 'Failed to generate embedding', 'policies': []})
                  
                  # Build search query with company filter
                  filters = [{'term': {'company_id': company_id}}]
                  if payer:
                      filters.append({'term': {'payer_id': payer.upper()}})
                  if denial_code:
                      filters.append({'term': {'denial_code': denial_code}})
                  
                  search_query = {
                      'size': 10,
                      'query': {
                          'bool': {
                              'must': [
                                  {
                                      'knn': {
                                          'content_vector': {
                                              'vector': query_embedding,
                                              'k': 10
                                          }
                                      }
                                  }
                              ],
                              'filter': filters
                          }
                      },
                      '_source': {'excludes': ['content_vector']}
                  }
                  
                  response = client.search(index='payer-policies', body=search_query)
                  hits = response.get('hits', {}).get('hits', [])
                  
                  policies = [{
                      'id': hit['_id'],
                      'score': hit['_score'],
                      'payer': hit['_source'].get('payer_id', 'unknown'),
                      'policyType': hit['_source'].get('policy_type', 'unknown'),
                      'documentName': hit['_source'].get('document_name', ''),
                      'content': hit['_source'].get('content_text', '')[:500] + '...'
                  } for hit in hits]
                  
                  return format_response({
                      'companyId': company_id,
                      'query': query,
                      'payer': payer,
                      'denialCode': denial_code,
                      'policies': policies,
                      'totalResults': len(policies),
                      'searchType': 'semantic'
                  })
                  
              except ImportError:
                  logger.warning("OpenSearch libraries not available, falling back to S3 search")
                  return list_policies(company_id, payer, denial_code, '')
              except Exception as e:
                  logger.error(f"Semantic search error: {str(e)}")
                  return list_policies(company_id, payer, denial_code, '')

          def list_policies(company_id, payer, denial_code, cpt_code):
              """List policies from S3 (fallback when OpenSearch not available)"""
              policies = []
              try:
                  # Build prefix based on company and payer
                  prefix = f'payer-rules/{payer.upper()}/' if payer else 'payer-rules/'
                  
                  response = s3.list_objects_v2(
                      Bucket=PAYER_RULES_BUCKET,
                      Prefix=prefix
                  )
                  
                  for obj in response.get('Contents', [])[:20]:
                      key = obj['Key']
                      if key.endswith('.pdf') or key.endswith('.json'):
                          parts = key.split('/')
                          policies.append({
                              'key': key,
                              'payer': parts[1] if len(parts) > 1 else 'unknown',
                              'documentName': parts[-1] if parts else key,
                              'lastModified': obj['LastModified'].isoformat(),
                              'size': obj['Size']
                          })
              except Exception as e:
                  logger.error(f"S3 list error: {str(e)}")
                  return format_response({'error': str(e), 'policies': []})
              
              return format_response({
                  'companyId': company_id,
                  'payer': payer,
                  'denialCode': denial_code,
                  'cptCode': cpt_code,
                  'policies': policies,
                  'totalResults': len(policies),
                  'searchType': 's3_list',
                  'recommendation': f'Found {len(policies)} policies for {payer or "all payers"}'
              })

          def format_response(data):
              return {
                  'messageVersion': '1.0',
                  'response': {
                      'actionGroup': 'PolicyActions',
                      'apiPath': '/policies/search',
                      'httpMethod': 'GET',
                      'httpStatusCode': 200,
                      'responseBody': {
                          'application/json': {
                              'body': json.dumps(data)
                          }
                      }
                  }
              }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  SearchPoliciesPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SearchPoliciesFunction
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # Action Group Lambda - Calculate Appeal Priority
  CalculatePriorityFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-calculate-priority'
      Description: Agent action to calculate appeal priority score
      Runtime: python3.11
      Handler: index.handler
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt AgentActionLambdaRole.Arn
      Environment:
        Variables:
          CLAIMS_TABLE:
            Fn::ImportValue: !Sub '${DataStackName}-ClaimsTable'
          OUTCOMES_TABLE:
            Fn::ImportValue: !Sub '${DataStackName}-AppealOutcomesTable'
      Code:
        ZipFile: |
          import os
          import json
          import boto3
          from decimal import Decimal

          dynamodb = boto3.resource('dynamodb')
          CLAIMS_TABLE = os.environ['CLAIMS_TABLE']
          OUTCOMES_TABLE = os.environ['OUTCOMES_TABLE']

          def handler(event, context):
              parameters = event.get('parameters', [])
              params = {p['name']: p['value'] for p in parameters}
              
              claim_amount = float(params.get('claimAmount', 0))
              denial_code = params.get('denialCode', '')
              payer = params.get('payer', '')
              days_to_deadline = int(params.get('daysToDeadline', 30))
              
              # Calculate priority score (1-100)
              base_score = min(claim_amount / 100, 40)  # Up to 40 points for amount
              urgency_score = max(0, 30 - days_to_deadline)  # Up to 30 points for urgency
              
              # Historical success rate lookup
              success_rate = get_historical_success_rate(payer, denial_code)
              success_score = success_rate * 0.3  # Up to 30 points
              
              total_score = min(100, base_score + urgency_score + success_score)
              
              return format_response({
                  'priorityScore': round(total_score, 2),
                  'claimAmount': claim_amount,
                  'expectedRecovery': round(claim_amount * (success_rate / 100), 2),
                  'successProbability': success_rate,
                  'urgencyLevel': 'HIGH' if days_to_deadline < 7 else 'MEDIUM' if days_to_deadline < 30 else 'LOW',
                  'recommendation': get_recommendation(total_score)
              })

          def get_historical_success_rate(payer, denial_code):
              # Default rates by denial code category
              rates = {
                  'CO-4': 75, 'CO-16': 65, 'CO-18': 80,
                  'CO-45': 55, 'CO-50': 70, 'CO-97': 60,
                  'PR-1': 45, 'PR-2': 50, 'PR-3': 40
              }
              return rates.get(denial_code, 60)

          def get_recommendation(score):
              if score >= 80:
                  return 'IMMEDIATE_APPEAL - High value, high probability'
              elif score >= 60:
                  return 'PRIORITY_APPEAL - Good recovery opportunity'
              elif score >= 40:
                  return 'STANDARD_APPEAL - Moderate priority'
              else:
                  return 'REVIEW_FIRST - Evaluate before appealing'

          def format_response(data):
              return {
                  'messageVersion': '1.0',
                  'response': {
                      'actionGroup': 'PriorityActions',
                      'apiPath': '/priority/calculate',
                      'httpMethod': 'POST',
                      'httpStatusCode': 200,
                      'responseBody': {
                          'application/json': {
                              'body': json.dumps(data)
                          }
                      }
                  }
              }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  CalculatePriorityPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CalculatePriorityFunction
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # ---------------------------------------------------------------------------
  # OpenSearch Index Manager Lambda (Multi-Tenant Support)
  # ---------------------------------------------------------------------------
  OpenSearchManagerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-opensearch-manager-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
